services:
  - type: web
    name: modelforge-3dhome
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Internet-facing: the machine-local endpoints (LAN smart-home proxy,
      # model backups, blueprint vision) answer 404 here.
      - key: HOME3D_PUBLIC
        value: "1"

280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="35.748" y="18.808" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.10A / PDF179 / 3-51 / INCHES</text><text x="35.748" y="22.588" font-size="2.8" text-anchor="start" fill="#101418">Diameter .2500 THRU ALL: full part thickness.</text><text x="35.748" y="26.368" font-size="2.8" text-anchor="start" fill="#101418">Counterbore symbol: cylindrical flat-bottom recess.</text><text x="35.748" y="30.148" font-size="2.8" text-anchor="start" fill="#101418">Counterbore diameter .5000.</text><text x="35.748" y="33.928" font-size="2.8" text-anchor="start" fill="#101418">Depth symbol: recess depth .1250.</text><text x="35.748" y="37.708" font-size="2.8" text-anchor="start" fill="#101418">The counterbore is distinct from the through bore.</text><text x="35.748" y="68.849" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.10B / PDF179 / 3-51 / INCHES</text><text x="35.748" y="72.629" font-size="2.8" text-anchor="start" fill="#101418">Diameter .3970 THRU ALL: full part thickness.</text><text x="35.748" y="76.409" font-size="2.8" text-anchor="start" fill="#101418">Countersink symbol: conical recess.</text><text x="35.748" y="80.189" font-size="2.8" text-anchor="start" fill="#101418">Countersink diameter .7731, included angle82deg.</text><text x="35.748" y="83.969" font-size="2.8" text-anchor="start" fill="#101418">Counterbore / flat recess diameter .7731, depth .0402.</text><text x="35.748" y="87.749" font-size="2.8" text-anchor="start" fill="#101418">Both recess operations appear in the source callout.</text><text x="35.748" y="123.894" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.14 / PDF180 / 3-52 / INCHES</text><text x="35.748" y="127.674" font-size="2.8" text-anchor="start" fill="#101418">Source thread note:1/4-20-2 UNC2A.</text><text x="35.748" y="131.454" font-size="2.8" text-anchor="start" fill="#101418">Pitch:1/20=.050in.</text><text x="35.748" y="135.234" font-size="2.8" text-anchor="start" fill="#101418">Major diameter:1/4=.250in.</text><text x="35.748" y="139.014" font-size="2.8" text-anchor="start" fill="#101418">External male thread: suffix A.</text><text x="35.748" y="142.794" font-size="2.8" text-anchor="start" fill="#101418">Right-hand and single-start unless otherwise specified.</text><text x="35.748" y="173.935" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.14 - CONTINUED</text><text x="35.748" y="177.715" font-size="2.8" text-anchor="start" fill="#101418">20 threads per inch.</text><text x="35.748" y="181.495" font-size="2.8" text-anchor="start" fill="#101418">Class2A, UNC coarse series.</text><text x="35.748" y="185.275" font-size="2.8" text-anchor="start" fill="#101418">Length2in in this book example notation.</text><text x="35.748" y="189.055" font-size="2.8" text-anchor="start" fill="#101418">Book explanation:PDF171 / printed3-43.</text><text x="35.748" y="192.835" font-size="2.8" text-anchor="start" fill="#101418">The middle2 denotes length here, not another fit class.</text><text x="235.911" y="18.808" font-size="2.8" text-anchor="start" fill="#101418">EXERCISES 3.11 / 3.12 / PDF179 / 3-51</text><text x="235.911" y="22.588" font-size="2.8" text-anchor="start" fill="#101418">3.11 TRUE: class1 is the loosest thread fit.</text><text x="235.911" y="26.368" font-size="2.8" text-anchor="start" fill="#101418">3.12 first statement FALSE.</text><text x="235.911" y="30.148" font-size="2.8" text-anchor="start" fill="#101418">The upper limit is placed ABOVE the lower limit.</text><text x="235.911" y="33.928" font-size="2.8" text-anchor="start" fill="#101418">3.12 second statement TRUE.</text><text x="235.911" y="37.708" font-size="2.8" text-anchor="start" fill="#101418">On one line the lower limit precedes the higher.</text><text x="235.911" y="73.853" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.13 / PDF179 / 3-51</text><text x="235.911" y="77.633" font-size="2.8" text-anchor="start" fill="#101418">Inch statement FALSE: trailing zeros indicate precision.</text><text x="235.911" y="81.413" font-size="2.8" text-anchor="start" fill="#101418">For inch values below1, the book omits leading0.</text><text x="235.911" y="85.193" font-size="2.8" text-anchor="start" fill="#101418">Metric statement FALSE: do not round all values to whole mm.</text><text x="235.911" y="88.973" font-size="2.8" text-anchor="start" fill="#101418">Whole-mm values omit decimal zeros in this convention.</text><text x="235.911" y="92.753" font-size="2.8" text-anchor="start" fill="#101418">Metric values below1mm use a leading0.</text><text x="235.911" y="128.898" font-size="2.8" text-anchor="start" fill="#101418">EXERCISES 3.15 / 3.16 / PDF180 / 3-52 / INCHES</text><text x="235.911" y="132.678" font-size="2.8" text-anchor="start" fill="#101418">Hole limits:1.124 to1.126.</text><text x="235.911" y="136.458" font-size="2.8" text-anchor="start" fill="#101418">Shaft limits:1.121 to1.124.</text><text x="235.911" y="140.238" font-size="2.8" text-anchor="start" fill="#101418">3.15 MMC allowance=1.124-1.124=.000in.</text><text x="235.911" y="144.018" font-size="2.8" text-anchor="start" fill="#101418">Line-to-line at the tightest permissible fit.</text><text x="235.911" y="147.798" font-size="2.8" text-anchor="start" fill="#101418">3.16 maximum clearance=1.126-1.121=.005in.</text><text x="235.911" y="183.943" font-size="2.8" text-anchor="start" fill="#101418">WORKSHEET SCOPE</text><text x="235.911" y="187.723" font-size="2.8" text-anchor="start" fill="#101418">Answers follow the supplied book examples.</text><text x="235.911" y="191.503" font-size="2.8" text-anchor="start" fill="#101418">All callout dimensions and fit values are inches.</text><text x="235.911" y="195.283" font-size="2.8" text-anchor="start" fill="#101418">Drafting convention statements are book-context answers.</text><text x="235.911" y="199.063" font-size="2.8" text-anchor="start" fill="#101418">No current standards-edition certification is claimed.</text><text x="235.911" y="202.843" font-size="2.8" text-anchor="start" fill="#101418">No placeholder CAD solid or invented source dimensions.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fi
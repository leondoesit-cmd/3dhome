8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="74.61" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER6 - REVIEW ANSWERS Q1-Q16</text><text x="74.61" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed6-33 / PDF301, Planchard2021.</text><text x="74.61" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations; book menus identified as source workflow.</text><text x="74.61" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="74.61" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Revolve/thin/dome features</text><text x="74.61" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Revolved Base creates the initial solid by rotating a profile</text><text x="74.61" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">about an axis;Revolved Boss adds similarly rotated</text><text x="74.61" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">material;Revolved Cut removes rotated profile volume;Revolved Cut</text><text x="74.61" y="74.808" font-size="2.8" text-anchor="start" fill="#101418">Thin removes a specified-thickness swept/revolved band;Dome forms</text><text x="74.61" y="78.588" font-size="2.8" text-anchor="start" fill="#101418">a domed deformation on selected face geometry.</text><text x="74.61" y="88.728" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Symmetry</text><text x="74.61" y="92.508" font-size="2.8" text-anchor="start" fill="#101418">Constrain paired sketch entities as mirror images about a</text><text x="74.61" y="96.288" font-size="2.8" text-anchor="start" fill="#101418">centerline,keeping corresponding distances/shapes equal.</text><text x="74.61" y="107.253" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Trim Entities</text><text x="74.61" y="111.033" font-size="2.8" text-anchor="start" fill="#101418">Remove unwanted portions of sketch geometry to produce the</text><text x="74.61" y="114.813" font-size="2.8" text-anchor="start" fill="#101418">intended profile while retaining the required boundaries.</text><text x="74.61" y="125.777" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Shell</text><text x="74.61" y="129.557" font-size="2.8" text-anchor="start" fill="#101418">Hollow a solid to a specified wall thickness,optionally removing</text><text x="74.61" y="133.337" font-size="2.8" text-anchor="start" fill="#101418">selected faces to create openings.</text><text x="74.61" y="144.302" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Centerpoint arc</text><text x="74.61" y="148.082" font-size="2.8" text-anchor="start" fill="#101418">Three points:center,start,end.</text><text x="74.61" y="159.323" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Hole Wizard</text><text x="74.61" y="163.103" font-size="2.8" text-anchor="start" fill="#101418">Creates standardized hole types/sizes/end conditions and</text><text x="74.61" y="166.883" font-size="2.8" text-anchor="start" fill="#101418">positional geometry,e.g.clearance,tapped,counterbored,countersunk</text><text x="74.61" y="170.663" font-size="2.8" text-anchor="start" fill="#101418">holes. Standard metadata does not make a cosmetic thread a</text><text x="74.61" y="174.443" font-size="2.8" text-anchor="start" fill="#101418">physical helix.</text><text x="74.61" y="184.857" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Spline</text><text x="74.61" y="188.637" font-size="2.8" text-anchor="start" fill="#101418">A smooth curve controlled by fit/control points and optional</text><text x="74.61" y="192.417" font-size="2.8" text-anchor="start" fill="#101418">tangent/curvature handles,used for shapes not conveniently formed</text><text x="74.61" y="196.197" font-size="2.8" text-anchor="start" fill="#101418">from straight lines/circular arcs.</text><text x="74.61" y="206.887" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Circular Pattern inputs</text><text x="74.61" y="210.667" font-size="2.8" text-anchor="start" fill="#101418">Seed feature/body/face scope,rotation axis,instance count and</text><text x="74.61" y="214.447" font-size="2.8" text-anchor="start" fill="#101418">angular extent/spacing;choose required instances and</text><text x="74.61" y="218.227" font-size="2.8" text-anchor="start" fill="#101418">merge/geometry options where applicable.</text><text x="264.866" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Temporary axes menu</text><text x="264.866" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Book:View→Hide/Show→Temporary Axes.</text><text x="264.866" y="74.709" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Show/hide plane</text><text x="264.866" y="78.489" font-size="2.8" text-anchor="start" fill="#101418">Book:select/right-click the plane in the FeatureManager and</text><text x="264.866" y="82.269" font-size="2.8" text-anchor="start" fill="#101418">choose Show or Hide;global plane display can also be controlled</text><text x="264.866" y="86.049" font-size="2.8" text-anchor="start" fill="#101418">through View→Hide/Show.</text><text x="264.866" y="96.738" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Offset versus Convert</text><text x="264.866" y="100.518" font-size="2.8" text-anchor="start" fill="#101418">Convert projects selected existing edges/faces into the active</text><text x="264.866" y="104.298" font-size="2.8" text-anchor="start" fill="#101418">sketch and can keep their association;Offset creates</text><text x="264.866" y="108.078" font-size="2.8" text-anchor="start" fill="#101418">parallel/concentric copies at a specified distance,with</text><text x="264.866" y="111.858" font-size="2.8" text-anchor="start" fill="#101418">direction/scope options.</text><text x="264.866" y="122.273" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Mirror reference line</text><text x="264.866" y="126.053" font-size="2.8" text-anchor="start" fill="#101418">A construction centerline.</text><text x="264.866" y="137.293" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Mirror relation</text><text x="264.866" y="141.073" font-size="2.8" text-anchor="start" fill="#101418">Symmetric relation about that centerline.</text><text x="264.866" y="152.313" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Center for maximum arc dimension</text><text x="264.866" y="156.093" font-size="2.8" text-anchor="start" fill="#101418">False. Selecting the center gives a center-based dimension.</text><text x="264.866" y="159.873" font-size="2.8" text-anchor="start" fill="#101418">Choose the arc&#39;s appropriate side/selection condition or set its</text><text x="264.866" y="163.653" font-size="2.8" text-anchor="start" fill="#101418">Arc Condition to Max to dimension the far extreme.</text><text x="264.866" y="174.343" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Transparency on Features toolbar</text><text x="264.866" y="178.123" font-size="2.8" text-anchor="start" fill="#101418">False. The book treats transparency as an optical/appearance</text><text x="264.866" y="181.903" font-size="2.8" text-anchor="start" fill="#101418">property and also uses Change Transparency from the context</text><text x="264.866" y="185.683" font-size="2.8" text-anchor="start" fill="#101418">interface.</text><text x="264.866" y="196.373" font-size="2.8" text-anchor="start" fill="#101418">Q16 - Further Revolve information</text><text x="264.866" y="200.153" font-size="2.8" text-anchor="start" fill="#101418">SOLIDWORKS Help and the feature PropertyManager help;the book</text><text x="264.866" y="203.933" font-size="2.8" text-anchor="start" fill="#101418">also directs users to SOLIDWORKS Tutorials for worked examples.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER6 - REVIEW Q1-Q16</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD6-33/PDF301</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER1 - REVIEW ANSWERS Q1-Q15</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed1-51 / PDF79, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations under the book mechanical-drafting convention.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">Questions summarized; no official answer-key or physical-model claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Cartesian coordinates</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Perpendicular X,Y,Z axes locate a point by signed distances from</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">a common origin. In a2D sketch use two axes; the third describes</text><text x="34.756" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">the normal/depth direction.</text><text x="34.756" y="84.722" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Axis intersection</text><text x="34.756" y="88.502" font-size="2.8" text-anchor="start" fill="#101418">The origin, with coordinates(0,0,0), or(0,0)in2D.</text><text x="34.756" y="109.756" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Right-hand rule</text><text x="34.756" y="113.536" font-size="2.8" text-anchor="start" fill="#101418">Point the right-hand index along+X and middle finger along+Y; the</text><text x="34.756" y="117.316" font-size="2.8" text-anchor="start" fill="#101418">thumb points+Z. Equivalently curl from+X toward+Y and the thumb</text><text x="34.756" y="121.096" font-size="2.8" text-anchor="start" fill="#101418">gives+Z. Positive rotation curls around a positively directed</text><text x="34.756" y="124.876" font-size="2.8" text-anchor="start" fill="#101418">axis with the thumb along that axis.</text><text x="34.756" y="134.79" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Freehand sketching</text><text x="34.756" y="138.57" font-size="2.8" text-anchor="start" fill="#101418">It communicates and tests shape, proportions and spatial</text><text x="34.756" y="142.35" font-size="2.8" text-anchor="start" fill="#101418">relationships quickly, before detailed CAD or manufacturing</text><text x="34.756" y="146.13" font-size="2.8" text-anchor="start" fill="#101418">dimensions.</text><text x="34.756" y="159.823" font-size="2.8" text-anchor="start" fill="#101418">Q5 - First versus third angle</text><text x="34.756" y="163.603" font-size="2.8" text-anchor="start" fill="#101418">First angle places the object between observer and projection</text><text x="34.756" y="167.383" font-size="2.8" text-anchor="start" fill="#101418">plane; Top is below Front and Right is left of Front. Third angle</text><text x="34.756" y="171.163" font-size="2.8" text-anchor="start" fill="#101418">places the plane between observer and object; Top is above Front</text><text x="34.756" y="174.943" font-size="2.8" text-anchor="start" fill="#101418">and Right is right of Front.</text><text x="34.756" y="184.857" font-size="2.8" text-anchor="start" fill="#101418">Q6 - US first-angle statement</text><text x="34.756" y="188.637" font-size="2.8" text-anchor="start" fill="#101418">False under the book&#39;s US convention: the book uses third-angle</text><text x="34.756" y="192.417" font-size="2.8" text-anchor="start" fill="#101418">projection.</text><text x="34.756" y="209.891" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Line precedence</text><text x="34.756" y="213.671" font-size="2.8" text-anchor="start" fill="#101418">When lines coincide, draw the higher-priority one:</text><text x="34.756" y="217.451" font-size="2.8" text-anchor="start" fill="#101418">Visible,Hidden,Cutting-plane,Center,Phantom,Break,Dimension,Extension/Leader,Section.</text><text x="34.756" y="221.231" font-size="2.8" text-anchor="start" fill="#101418">A visible edge replaces a coincident hidden line; a hidden line</text><text x="34.756" y="225.011" font-size="2.8" text-anchor="start" fill="#101418">overrides a coincident centerline. Source priority list is</text><text x="34.756" y="228.791" font-size="2.8" text-anchor="start" fill="#101418">PDF51/1-23.</text><text x="34.756" y="234.924" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Hidden overrides visible</text><text x="34.756" y="238.704" font-size="2.8" text-anchor="start" fill="#101418">False. A visible/object line takes priority over a coincident</text><text x="34.756" y="242.484" font-size="2.8" text-anchor="start" fill="#101418">hidden line.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q9 - 2D quadrants</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">True: two intersecting perpendicular axes divide the plane into</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">quadrantsI–IV. Conventional numbering starts upper-right and</text><text x="225.012" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">proceeds counterclockwise.</text><text x="225.012" y="84.722" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Glass box</text><text x="225.012" y="88.502" font-size="2.8" text-anchor="start" fill="#101418">Place the part inside a transparent box, project perpendicular to</text><text x="225.012" y="92.282" font-size="2.8" text-anchor="start" fill="#101418">each face, then unfold the faces into the chosen</text><text x="225.012" y="96.062" font-size="2.8" text-anchor="start" fill="#101418">first-/third-angle arrangement. The aligned views show</text><text x="225.012" y="99.842" font-size="2.8" text-anchor="start" fill="#101418">width,height,depth consistently.</text><text x="225.012" y="109.756" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Same six views</text><text x="225.012" y="113.536" font-size="2.8" text-anchor="start" fill="#101418">True. Front,Back,Top,Bottom,Left,Right view directions are the</text><text x="225.012" y="117.316" font-size="2.8" text-anchor="start" fill="#101418">same; the sheet arrangement changes.</text><text x="225.012" y="134.79" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Hatch material indication</text><text x="225.012" y="138.57" font-size="2.8" text-anchor="start" fill="#101418">True. Section hatch conventions can distinguish material types; a</text><text x="225.012" y="142.35" font-size="2.8" text-anchor="start" fill="#101418">material specification can still be needed for an exact grade.</text><text x="225.012" y="159.823" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Mechanical dimension endings</text><text x="225.012" y="163.603" font-size="2.8" text-anchor="start" fill="#101418">True within the book&#39;s stated mechanical-drawing rule: dimension</text><text x="225.012" y="167.383" font-size="2.8" text-anchor="start" fill="#101418">lines end with arrowheads. Architectural slash/dot practice is</text><text x="225.012" y="171.163" font-size="2.8" text-anchor="start" fill="#101418">separately identified in the source.</text><text x="225.012" y="184.857" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Break lines</text><text x="225.012" y="188.637" font-size="2.8" text-anchor="start" fill="#101418">True with distinction: they mark an omitted portion/imaginary</text><text x="225.012" y="192.417" font-size="2.8" text-anchor="start" fill="#101418">break. A long shaft can be shortened on paper; a broken-out view</text><text x="225.012" y="196.197" font-size="2.8" text-anchor="start" fill="#101418">exposes a local interior. A full section uses a</text><text x="225.012" y="199.977" font-size="2.8" text-anchor="start" fill="#101418">cutting-plane/section-view convention.</text><text x="225.012" y="209.891" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Front selection</text><text x="225.012" y="213.671" font-size="2.8" text-anchor="start" fill="#101418">True as a design guideline. Choose the most informative</text><text x="225.012" y="217.451" font-size="2.8" text-anchor="start" fill="#101418">orientation with few hidden lines; project the other views from</text><text x="225.012" y="221.231" font-size="2.8" text-anchor="start" fill="#101418">it. Its name need not match the part&#39;s installed front.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER1 - REVIEW Q1-Q15</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD 1-51 / PDF79</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
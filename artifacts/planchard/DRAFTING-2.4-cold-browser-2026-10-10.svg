280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="39.763" y="34.655" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 2.4 - VANISHING POINTS</text><text x="39.763" y="38.435" font-size="2.8" text-anchor="start" fill="#101418">Source: Engineering Graphics with SOLIDWORKS2021.</text><text x="39.763" y="42.215" font-size="2.8" text-anchor="start" fill="#101418">Printed2-41 / PDF127; three source pictures left to right.</text><text x="39.763" y="45.995" font-size="2.8" text-anchor="start" fill="#101418">Perspective convergence, not axonometric parallel projection.</text><text x="39.763" y="84.722" font-size="2.8" text-anchor="start" fill="#101418">PICTURE1 - LEFT: THREE</text><text x="39.763" y="88.502" font-size="2.8" text-anchor="start" fill="#101418">Both horizontal direction families converge.</text><text x="39.763" y="92.282" font-size="2.8" text-anchor="start" fill="#101418">The vertical column edges also converge.</text><text x="39.763" y="96.062" font-size="2.8" text-anchor="start" fill="#101418">Three independent vanishing directions.</text><text x="169.938" y="84.722" font-size="2.8" text-anchor="start" fill="#101418">PICTURE2 - MIDDLE: TWO</text><text x="169.938" y="88.502" font-size="2.8" text-anchor="start" fill="#101418">Both horizontal direction families converge.</text><text x="169.938" y="92.282" font-size="2.8" text-anchor="start" fill="#101418">Vertical column edges remain parallel.</text><text x="169.938" y="96.062" font-size="2.8" text-anchor="start" fill="#101418">Two horizontal vanishing directions.</text><text x="300.113" y="84.722" font-size="2.8" text-anchor="start" fill="#101418">PICTURE3 - RIGHT: ONE</text><text x="300.113" y="88.502" font-size="2.8" text-anchor="start" fill="#101418">Front horizontals and verticals remain parallel.</text><text x="300.113" y="92.282" font-size="2.8" text-anchor="start" fill="#101418">Only the receding depth family converges.</text><text x="300.113" y="96.062" font-size="2.8" text-anchor="start" fill="#101418">One depth vanishing direction.</text><text x="39.763" y="144.803" font-size="2.8" text-anchor="start" fill="#101418">ANSWER ORDER: 3 / 2 / 1</text><text x="39.763" y="148.583" font-size="2.8" text-anchor="start" fill="#101418">Read the pictures in their printed left-to-right order.</text><text x="39.763" y="152.363" font-size="2.8" text-anchor="start" fill="#101418">These are reasoned answers from the source images.</text><text x="39.763" y="156.143" font-size="2.8" text-anchor="start" fill="#101418">No physical size, native solid or official answer key is claimed.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="2
280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="39.668" y="34.652" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER10 - DRAFTING SAMPLE Q1-Q6</text><text x="39.668" y="38.432" font-size="2.8" text-anchor="start" fill="#101418">Engineering Graphics with SOLIDWORKS2021</text><text x="39.668" y="42.212" font-size="2.8" text-anchor="start" fill="#101418">Source: printed10-13..14 / PDF493..494.</text><text x="39.668" y="45.992" font-size="2.8" text-anchor="start" fill="#101418">The book explicitly prints all six answer letters.</text><text x="39.668" y="84.692" font-size="2.8" text-anchor="start" fill="#101418">Q1: B - CLOSED SPLINE</text><text x="39.668" y="88.472" font-size="2.8" text-anchor="start" fill="#101418">The view boundary must be closed.</text><text x="39.668" y="92.252" font-size="2.8" text-anchor="start" fill="#101418">Q2: A - CROP VIEW</text><text x="39.668" y="96.032" font-size="2.8" text-anchor="start" fill="#101418">Restrict the displayed region with a closed sketch.</text><text x="169.772" y="84.692" font-size="2.8" text-anchor="start" fill="#101418">Q3: B - ALTERNATIVE POSITION VIEW</text><text x="169.772" y="88.472" font-size="2.8" text-anchor="start" fill="#101418">Overlay a second assembly pose.</text><text x="169.772" y="92.252" font-size="2.8" text-anchor="start" fill="#101418">Q4: B - BREAK VIEW</text><text x="169.772" y="96.032" font-size="2.8" text-anchor="start" fill="#101418">Shorten a long view using break lines.</text><text x="299.877" y="84.692" font-size="2.8" text-anchor="start" fill="#101418">Q5: D - ALIGNED SECTION VIEW</text><text x="299.877" y="88.472" font-size="2.8" text-anchor="start" fill="#101418">Align the angled cutting-plane portions.</text><text x="299.877" y="92.252" font-size="2.8" text-anchor="start" fill="#101418">Q6: B - CLOSED PROFILE: SPLINE</text><text x="299.877" y="96.032" font-size="2.8" text-anchor="start" fill="#101418">Define the local section boundary.</text><text x="39.668" y="149.744" font-size="2.8" text-anchor="start" fill="#101418">PRINTED ANSWER ORDER: B / A / B / B / D / B</text><text x="39.668" y="153.524" font-size="2.8" text-anchor="start" fill="#101418">This worksheet records the source answers and view concepts.</text><text x="39.668" y="157.304" font-size="2.8" text-anchor="start" fill="#101418">It does not certify every advanced view workflow in ModelForge.</text><text x="39.668" y="161.084" font-size="2.8" text-anchor="start" fill="#101418">No native solid, imported publisher model or external exam result.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="
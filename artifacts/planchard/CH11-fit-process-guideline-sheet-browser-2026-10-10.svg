280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="40.857" y="28.604" font-size="2.8" text-anchor="start" fill="#101418">CH11: DIGITAL STUDY / PHYSICAL CHECKS — PDF548–555, 11-28–11-35</text><text x="40.857" y="32.384" font-size="2.8" text-anchor="start" fill="#101418">Digital slicing/export does not demonstrate a successful physical print.</text><text x="40.857" y="36.164" font-size="2.8" text-anchor="start" fill="#101418">PDF549: suggested fit tolerances: tight ±0.1; hinge ±0.2; loose ±0.3 mm.</text><text x="40.857" y="39.944" font-size="2.8" text-anchor="start" fill="#101418">These are process guidelines, not specified nominal clearance values.</text><text x="40.857" y="43.724" font-size="2.8" text-anchor="start" fill="#101418">Existing 8.2 geometry: AXLE Ø4.7752 mm; FLAT BAR bore Ø4.8260 mm.</text><text x="40.857" y="47.504" font-size="2.8" text-anchor="start" fill="#101418">Nominal gap: 0.0508 mm diametral; 0.0254 mm radial when concentric.</text><text x="40.857" y="51.284" font-size="2.8" text-anchor="start" fill="#101418">PDF551: optional pads Ø10 mm, 1–2 layers; here 0.2–0.4 mm at 0.2 mm/layer.</text><text x="40.857" y="55.064" font-size="2.8" text-anchor="start" fill="#101418">PDF551: 30°–150° self-support guideline depends on process and geometry.</text><text x="40.857" y="58.844" font-size="2.8" text-anchor="start" fill="#101418">PDF552: layer height guideline = 1/4–1/2 nozzle diameter, printer dependent.</text><text x="40.857" y="62.624" font-size="2.8" text-anchor="start" fill="#101418">PDF549: smallest-feature rule ≈ twice thread width; 0.4 mm implies 0.8 mm.</text><text x="40.857" y="66.404" font-size="2.8" text-anchor="start" fill="#101418">PDF553: 15–20% infill is a guideline; orientation affects printed strength.</text><text x="40.857" y="70.184" font-size="2.8" text-anchor="start" fill="#101418">PDF552: closed mesh and clearance help avoid fusing or trapped support.</text><text x="40.857" y="73.964" font-size="2.8" text-anchor="start" fill="#101418">PDF548–550/553: bed cleaning, leveling, temperature and fit need real tests.</text><text x="40.857" y="77.744" font-size="2.8" text-anchor="start" fill="#101418">PDF554: device drivers, printer networking and camera monitoring unverified.</text><text x="40.857" y="81.524" font-size="2.8" text-anchor="start" fill="#101418">PDF555: external learning account, quizzes and certification uncompleted.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600">MODELFORGE BOOK STUDY</text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280"></text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CH11 FIT AND PROCESS GUIDELINES</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">GUIDE-11</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0
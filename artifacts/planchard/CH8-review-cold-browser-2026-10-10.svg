8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER8 - REVIEW ANSWERS Q1-Q16</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed8-34 / PDF412, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations with assembly procedure examples.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Part template for assembly</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">False. Start an assembly from an Assembly template,with its own</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">units/properties. The book creates ASM-IN-ANSI and ASM-MM-ISO.</text><text x="34.756" y="75.209" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Distance versus Coincident</text><text x="34.756" y="78.989" font-size="2.8" text-anchor="start" fill="#101418">Distance enforces a nonzero signed separation,e.g.2.54mmSwitch/Handle</text><text x="34.756" y="82.769" font-size="2.8" text-anchor="start" fill="#101418">clearance. Coincident makes appropriate references share a</text><text x="34.756" y="86.549" font-size="2.8" text-anchor="start" fill="#101418">location/plane,e.g.a flange seated on a shoulder.</text><text x="34.756" y="94.235" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Assembly/subassembly</text><text x="34.756" y="98.015" font-size="2.8" text-anchor="start" fill="#101418">An assembly groups part/component occurrences and mates. An assembly</text><text x="34.756" y="101.795" font-size="2.8" text-anchor="start" fill="#101418">inserted inside another assembly is a subassembly;it is the same document</text><text x="34.756" y="105.575" font-size="2.8" text-anchor="start" fill="#101418">type used at a nested level.</text><text x="34.756" y="113.261" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Five modeling practices</text><text x="34.756" y="117.041" font-size="2.8" text-anchor="start" fill="#101418">Plan the component hierarchy;ground a meaningful reference component;use</text><text x="34.756" y="120.821" font-size="2.8" text-anchor="start" fill="#101418">functional mating geometry;constrain only intended freedoms;check</text><text x="34.756" y="124.601" font-size="2.8" text-anchor="start" fill="#101418">movement/interference. Additional practices:reuse subassemblies,organize</text><text x="34.756" y="128.381" font-size="2.8" text-anchor="start" fill="#101418">names/metadata,avoid redundant mates,and test source-edit propagation.</text><text x="34.756" y="135.791" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Interference test</text><text x="34.756" y="139.571" font-size="2.8" text-anchor="start" fill="#101418">Run Interference Detection on the required component scope and inspect</text><text x="34.756" y="143.351" font-size="2.8" text-anchor="start" fill="#101418">exact positive overlapping volumes. Example:the</text><text x="34.756" y="147.131" font-size="2.8" text-anchor="start" fill="#101418">source-selectedHousing/Battery check is clear,while the separate</text><text x="34.756" y="150.911" font-size="2.8" text-anchor="start" fill="#101418">all-visible FLASHLIGHT report records two unreviewed overlaps. Bounding-box</text><text x="34.756" y="154.691" font-size="2.8" text-anchor="start" fill="#101418">overlap alone is not exact interference.</text><text x="34.756" y="161.826" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Deform</text><text x="34.756" y="165.606" font-size="2.8" text-anchor="start" fill="#101418">A shape-modification feature that changes geometry using controls such as</text><text x="34.756" y="169.386" font-size="2.8" text-anchor="start" fill="#101418">point,curve-to-curve or surface-based deformation. It is different from</text><text x="34.756" y="173.166" font-size="2.8" text-anchor="start" fill="#101418">rigid component movement and is not a structural-analysis result.</text><text x="34.756" y="180.852" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Mates and purpose</text><text x="34.756" y="184.632" font-size="2.8" text-anchor="start" fill="#101418">Geometric relationships between component references that locate/align</text><text x="34.756" y="188.412" font-size="2.8" text-anchor="start" fill="#101418">parts and remove specified degrees of freedom,while retaining intentional</text><text x="34.756" y="192.192" font-size="2.8" text-anchor="start" fill="#101418">movement.</text><text x="34.756" y="199.877" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Six DOF</text><text x="34.756" y="203.657" font-size="2.8" text-anchor="start" fill="#101418">Three translations alongX,Y,Z and three rotations aboutX,Y,Z for a free</text><text x="34.756" y="207.437" font-size="2.8" text-anchor="start" fill="#101418">rigid occurrence.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Fixed component</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">True within its parent assembly frame:a fixed occurrence cannot move</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">relative to that frame. A nested rigid assembly can still move as a whole</text><text x="225.012" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">in a higher-level assembly.</text><text x="225.012" y="78.714" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Section view</text><text x="225.012" y="82.494" font-size="2.8" text-anchor="start" fill="#101418">An imaginary cutting plane removes the nearer material for visualization so</text><text x="225.012" y="86.274" font-size="2.8" text-anchor="start" fill="#101418">internal features are visible;cut material is typically hatched in a</text><text x="225.012" y="90.054" font-size="2.8" text-anchor="start" fill="#101418">drawing.</text><text x="225.012" y="97.74" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Suppressed feature/component</text><text x="225.012" y="101.52" font-size="2.8" text-anchor="start" fill="#101418">Suppressed feature is omitted from part rebuild; suppressed component is</text><text x="225.012" y="105.3" font-size="2.8" text-anchor="start" fill="#101418">omitted from active assembly participation/configuration.</text><text x="225.012" y="109.08" font-size="2.8" text-anchor="start" fill="#101418">Example:LensShield&#39;s source suppression/restoration versus suppressing an</text><text x="225.012" y="112.86" font-size="2.8" text-anchor="start" fill="#101418">optional assembly component. Hidden only affects display and is not</text><text x="225.012" y="116.64" font-size="2.8" text-anchor="start" fill="#101418">suppression.</text><text x="225.012" y="123.775" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Concentric faces</text><text x="225.012" y="127.555" font-size="2.8" text-anchor="start" fill="#101418">Typically cylindrical/conical faces or circular references whose axes can</text><text x="225.012" y="131.335" font-size="2.8" text-anchor="start" fill="#101418">be aligned;actual valid selectable geometry determines the mate.</text><text x="225.012" y="139.296" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Standard mate types/help</text><text x="225.012" y="143.076" font-size="2.8" text-anchor="start" fill="#101418">Book lists</text><text x="225.012" y="146.856" font-size="2.8" text-anchor="start" fill="#101418">Coincident,Parallel,Perpendicular,Tangent,Concentric,Lock,Distance,Angle.</text><text x="225.012" y="150.636" font-size="2.8" text-anchor="start" fill="#101418">For Tangent selection combinations and options,use SOLIDWORKS Help/Mate</text><text x="225.012" y="154.416" font-size="2.8" text-anchor="start" fill="#101418">PropertyManager help.</text><text x="225.012" y="161.826" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Only planes as references</text><text x="225.012" y="165.606" font-size="2.8" text-anchor="start" fill="#101418">False. Suitable faces,edges,axes,vertices,points and origins can also be</text><text x="225.012" y="169.386" font-size="2.8" text-anchor="start" fill="#101418">used.</text><text x="225.012" y="177.347" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Only faces as references</text><text x="225.012" y="181.127" font-size="2.8" text-anchor="start" fill="#101418">False. Suitable planes,axes,edges,points,vertices and origins are also</text><text x="225.012" y="184.907" font-size="2.8" text-anchor="start" fill="#101418">valid.</text><text x="225.012" y="192.868" font-size="2.8" text-anchor="start" fill="#101418">Q16 - Exploded view steps</text><text x="225.012" y="196.648" font-size="2.8" text-anchor="start" fill="#101418">Choose Exploded View,select components and translation/rotation</text><text x="225.012" y="200.428" font-size="2.8" text-anchor="start" fill="#101418">direction,set distances/angles,record ordered explode steps,accept/save,and</text><text x="225.012" y="204.208" font-size="2.8" text-anchor="start" fill="#101418">collapse/replay as needed. Add explode lines and drawing/BOM balloons</text><text x="225.012" y="207.988" font-size="2.8" text-anchor="start" fill="#101418">separately when required.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER8 - REVIEW Q1-Q16</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD8-34/PDF412</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
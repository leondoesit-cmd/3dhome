280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER3 - REVIEW ANSWERS Q1-Q14</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed3-46 / PDF174, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations; hole outlines on companion.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Duplicate/reference dimensions</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">True. Define a feature once; supplementary reference values are</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">parenthesized and should not add an independent manufacturing constraint.</text><text x="34.756" y="75.209" font-size="2.8" text-anchor="start" fill="#101418">Q2 - IPS</text><text x="34.756" y="78.989" font-size="2.8" text-anchor="start" fill="#101418">Inch,Pound,Second.</text><text x="34.756" y="87.226" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Hole-diameter view</text><text x="34.756" y="91.006" font-size="2.8" text-anchor="start" fill="#101418">The view where the hole appears as a circle.</text><text x="34.756" y="99.242" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Cylinder size view</text><text x="34.756" y="103.022" font-size="2.8" text-anchor="start" fill="#101418">The view where the cylinder appears as a rectangle normally carries its</text><text x="34.756" y="106.802" font-size="2.8" text-anchor="start" fill="#101418">length and diameter, withØ indicating diameter.</text><text x="34.756" y="114.763" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Hole dimensioning</text><text x="34.756" y="118.543" font-size="2.8" text-anchor="start" fill="#101418">Specify its diameter and locate its center from suitable datums/edges; add</text><text x="34.756" y="122.323" font-size="2.8" text-anchor="start" fill="#101418">depth/THRU and other hole details when necessary.</text><text x="34.756" y="130.284" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Hidden-line dimensions</text><text x="34.756" y="134.064" font-size="2.8" text-anchor="start" fill="#101418">True. Prefer a visible or section view; avoid dimensioning to hidden lines</text><text x="34.756" y="137.844" font-size="2.8" text-anchor="start" fill="#101418">when a clearer representation is available.</text><text x="34.756" y="145.804" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Through-hole suffix</text><text x="34.756" y="149.584" font-size="2.8" text-anchor="start" fill="#101418">THRU.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Unilateral tolerance</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">True. The permitted variation lies on only one side of</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">nominal,e.g.+0.02/−0.00 or+0.00/−0.02.</text><text x="225.012" y="75.209" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Angular subdivisions</text><text x="225.012" y="78.989" font-size="2.8" text-anchor="start" fill="#101418">Minutes and seconds:60minutes per degree,60seconds per minute. Use′ and″</text><text x="225.012" y="82.769" font-size="2.8" text-anchor="start" fill="#101418">when appropriate.</text><text x="225.012" y="90.73" font-size="2.8" text-anchor="start" fill="#101418">Q10 - External thread suffix</text><text x="225.012" y="94.51" font-size="2.8" text-anchor="start" fill="#101418">A,e.g.2A.</text><text x="225.012" y="102.746" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Internal thread suffix</text><text x="225.012" y="106.526" font-size="2.8" text-anchor="start" fill="#101418">B,e.g.2B.</text><text x="225.012" y="114.763" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Thread fit classes</text><text x="225.012" y="118.543" font-size="2.8" text-anchor="start" fill="#101418">Class1:loose/easy assembly;Class2:general-purpose commercial</text><text x="225.012" y="122.323" font-size="2.8" text-anchor="start" fill="#101418">fit;Class3:close precision fit. A/B distinguishes external/internal,not a</text><text x="225.012" y="126.103" font-size="2.8" text-anchor="start" fill="#101418">fourth fit class.</text><text x="225.012" y="133.788" font-size="2.8" text-anchor="start" fill="#101418">Q13 - 3/8-16 UNC2B DOUBLE pitch</text><text x="225.012" y="137.568" font-size="2.8" text-anchor="start" fill="#101418">Pitch=1/16in=0.0625in between adjacent threads. DOUBLE means two starts,so</text><text x="225.012" y="141.348" font-size="2.8" text-anchor="start" fill="#101418">lead=2×pitch=0.125in per revolution.3/8in is major diameter,UNC coarse</text><text x="225.012" y="145.128" font-size="2.8" text-anchor="start" fill="#101418">series,2B internal general-purpose class.</text><text x="225.012" y="152.814" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Hole symbols</text><text x="225.012" y="156.594" font-size="2.8" text-anchor="start" fill="#101418">Counterbore:⌴,a flat-bottom enlarged recess; Countersink:⌵,a conical</text><text x="225.012" y="160.374" font-size="2.8" text-anchor="start" fill="#101418">enlarged mouth. Reproduce the source symbol outlines visibly in the browser</text><text x="225.012" y="164.154" font-size="2.8" text-anchor="start" fill="#101418">worksheet.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER3 - REVIEW Q1-Q14</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD3-46-PDF174</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
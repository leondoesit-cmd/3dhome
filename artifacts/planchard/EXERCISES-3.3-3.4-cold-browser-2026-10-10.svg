nd .85 inside where space exists outside.</text><text x="235.911" y="38.932" font-size="2.8" text-anchor="start" fill="#101418">3. Extension lines touch object edges: no gap.</text><text x="235.911" y="42.712" font-size="2.8" text-anchor="start" fill="#101418">4. Internal step heights are unspecified.</text><text x="235.911" y="71.852" font-size="2.8" text-anchor="start" fill="#101418">SOURCE QUALIFICATION</text><text x="235.911" y="75.632" font-size="2.8" text-anchor="start" fill="#101418">The two .75 values locate different widths.</text><text x="235.911" y="79.412" font-size="2.8" text-anchor="start" fill="#101418">They are not automatically redundant.</text><text x="235.911" y="83.192" font-size="2.8" text-anchor="start" fill="#101418">Outline and labels reproduce source defects.</text><text x="235.911" y="86.972" font-size="2.8" text-anchor="start" fill="#101418">Paper positions are illustrative (40mm/in).</text><text x="235.911" y="90.752" font-size="2.8" text-anchor="start" fill="#101418">No invented step sizes or CAD drivers.</text><text x="235.911" y="128.898" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.4 / PDF176 / 3-48</text><text x="235.911" y="132.678" font-size="2.8" text-anchor="start" fill="#101418">Preference ranks, source top to bottom: 3, 1, 4, 2.</text><text x="235.911" y="136.458" font-size="2.8" text-anchor="start" fill="#101418">1: arrows inside / value inside.</text><text x="235.911" y="140.238" font-size="2.8" text-anchor="start" fill="#101418">2: arrows outside / value inside.</text><text x="235.911" y="144.018" font-size="2.8" text-anchor="start" fill="#101418">3: arrows inside / value outside.</text><text x="235.911" y="147.798" font-size="2.8" text-anchor="start" fill="#101418">4: arrows outside / value outside.</text><text x="35.748" y="188.947" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.3 - CIRCLED ERROR REGIONS</text><text x="35.748" y="192.727" font-size="2.8" text-anchor="start" fill="#101418">Left/right circles: missing vertical dimension lines.</text><text x="35.748" y="196.507" font-size="2.8" text-anchor="start" fill="#101418">Upper and .85 circles: inside dimensions / touching extensions.</text><text x="35.748" y="200.287" font-size="2.8" text-anchor="start" fill="#101418">Lower-right circle: extension contact without offset.</text><text x="35.748" y="204.067" font-size="2.8" text-anchor="start" fill="#101418">Step circle: absent heights; do not invent dimensions.</text><text x="35.748" y="207.847" font-size="2.8" text-anchor="start" fill="#101418">Manual paper graphics; source errors intentionally retained.</text><line x1="40" y1="45" x2="180" y2="45" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="180" y1="45" x2="180" y2="145" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="180" y1="145" x2="150" y2="145" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="150" y1="145" x2="150" y2="91" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="150" y1="91" x2="104" y2="91" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="104" y1="91" x2="104" y2="75" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="104" y1="75" x2="70" y2="75" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="70" y1="75" x2="70" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="70" y1="115" x2="40" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="40" y1="115" x2="40" y2="45" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="20" y1="44.825" x2="37.754" y2="44.825" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="20" y1="144.906" x2="148.845" y2="144.906" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="181.872" y1="44.825" x2="196.884" y2="44.825" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="114.882" x2="196.884" y2="114.882" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="56.834" x2="89.797" y2="56.834" fill="no
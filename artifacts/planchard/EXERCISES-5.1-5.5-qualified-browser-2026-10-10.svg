8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="40.752" y="18.808" font-size="2.8" text-anchor="start" fill="#101418">EXERCISES 5.1-5.5 - QUALIFIED DESIGN CHOICES</text><text x="40.752" y="22.588" font-size="2.8" text-anchor="start" fill="#101418">Source: PDF258-259 / pages5-40 and5-41.</text><text x="40.752" y="26.368" font-size="2.8" text-anchor="start" fill="#101418">Convention: Y up; X width; Z depth.</text><text x="40.752" y="30.148" font-size="2.8" text-anchor="start" fill="#101418">Front=X-Y, Right=Y-Z, Top=X-Z; not an official answer key.</text><text x="40.752" y="53.837" font-size="2.8" text-anchor="start" fill="#101418">5.1 - A: TOP PLANE</text><text x="40.752" y="57.617" font-size="2.8" text-anchor="start" fill="#101418">Sketch the full horizontal T footprint; extrude vertically along Y.</text><text x="40.752" y="61.397" font-size="2.8" text-anchor="start" fill="#101418">One Boss includes both branches at the same height.</text><text x="40.752" y="70.35" font-size="2.8" text-anchor="start" fill="#101418">5.2 - B: FRONT PLANE</text><text x="40.752" y="74.13" font-size="2.8" text-anchor="start" fill="#101418">Sketch the complete upright H-like section, posts and feet in X-Y.</text><text x="40.752" y="77.91" font-size="2.8" text-anchor="start" fill="#101418">Extrude along Z; upper and lower notches belong to the profile.</text><text x="40.752" y="81.69" font-size="2.8" text-anchor="start" fill="#101418">One Boss gives the repeated front/back section and joining web.</text><text x="40.752" y="90.367" font-size="2.8" text-anchor="start" fill="#101418">5.3 - B: FRONT PLANE</text><text x="40.752" y="94.147" font-size="2.8" text-anchor="start" fill="#101418">Sketch all three stair heights in the near X-Y section; extrude Z.</text><text x="40.752" y="97.927" font-size="2.8" text-anchor="start" fill="#101418">Add a Top-plane rectangular Cut for the low-tier plan notch.</text><text x="40.752" y="101.707" font-size="2.8" text-anchor="start" fill="#101418">One Boss plus one Cut; an unnotched stair alone is incomplete.</text><text x="40.752" y="110.383" font-size="2.8" text-anchor="start" fill="#101418">5.4 - C: RIGHT PLANE - OUR CONSTRUCTION CHOICE</text><text x="40.752" y="114.163" font-size="2.8" text-anchor="start" fill="#101418">Sketch the Y-Z base, low front step and high rear wall; extrude X.</text><text x="40.752" y="117.943" font-size="2.8" text-anchor="start" fill="#101418">Cut the interior front area to the base, preserving the left return.</text><text x="40.752" y="121.723" font-size="2.8" text-anchor="start" fill="#101418">Lower the rear wall at the right end with a second Cut.</text><text x="40.752" y="125.503" font-size="2.8" text-anchor="start" fill="#101418">Three features; a different Front-plane order can also be valid.</text><text x="40.752" y="133.902" font-size="2.8" text-anchor="start" fill="#101418">5.5 - C: ALUMINUM ALLOYS</text><text x="40.752" y="137.682" font-size="2.8" text-anchor="start" fill="#101418">6061 is an aluminum alloy in the source&#39;s material categories.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">EXERCISES5.1-5.5 - QUALIFIED PLANE CHOICES</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD5-40-41-PDF258-259</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
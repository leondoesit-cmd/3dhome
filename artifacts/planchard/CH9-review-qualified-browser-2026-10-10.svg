8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER9 - REVIEW ANSWERS Q1-Q19</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed9-38/39 / PDF472/473, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations with drawing procedure examples.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Drawing template/format</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Template sets document standard,units,precision and starting defaults;Sheet</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">Format defines border/titleblock/logo/static fields. A template can</text><text x="34.756" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">reference a format.</text><text x="34.756" y="78.714" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Save Sheet Format</text><text x="34.756" y="82.494" font-size="2.8" text-anchor="start" fill="#101418">Book:File→Save Sheet Format,producing.slddrt.</text><text x="34.756" y="90.73" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Save Drawing Template</text><text x="34.756" y="94.51" font-size="2.8" text-anchor="start" fill="#101418">Book:File→Save As and choose Drawing Templates(*.drwdot).</text><text x="34.756" y="102.746" font-size="2.8" text-anchor="start" fill="#101418">Q4 - BOM</text><text x="34.756" y="106.526" font-size="2.8" text-anchor="start" fill="#101418">A Bill of Materials lists assembly component/item identifiers,part</text><text x="34.756" y="110.306" font-size="2.8" text-anchor="start" fill="#101418">numbers,descriptions,quantities and optionally materials. Example:LINKS has</text><text x="34.756" y="114.086" font-size="2.8" text-anchor="start" fill="#101418">four distinct source part-number rows with corresponding balloons.</text><text x="34.756" y="121.772" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Drawing modes</text><text x="34.756" y="125.552" font-size="2.8" text-anchor="start" fill="#101418">Edit Sheet Format and Edit Sheet. Format mode edits the</text><text x="34.756" y="129.332" font-size="2.8" text-anchor="start" fill="#101418">border/titleblock;Sheet mode edits views,dimensions and drawing</text><text x="34.756" y="133.112" font-size="2.8" text-anchor="start" fill="#101418">annotations.</text><text x="34.756" y="140.798" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Seven titleblock fields</text><text x="34.756" y="144.578" font-size="2.8" text-anchor="start" fill="#101418">Company/organization;drawing title/description;drawing</text><text x="34.756" y="148.358" font-size="2.8" text-anchor="start" fill="#101418">number;revision;drawn-by;date;scale. Size,units,material,weight,approvals</text><text x="34.756" y="152.138" font-size="2.8" text-anchor="start" fill="#101418">and tolerances are additional common fields.</text><text x="34.756" y="159.823" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Insert Isometric</text><text x="34.756" y="163.603" font-size="2.8" text-anchor="start" fill="#101418">Book:use Model View/View Palette,select the part/assembly and isometric</text><text x="34.756" y="167.383" font-size="2.8" text-anchor="start" fill="#101418">orientation,then place and set view scale/display style. ModelForge&#39;s</text><text x="34.756" y="171.163" font-size="2.8" text-anchor="start" fill="#101418">Drawing view controls provide the equivalent view insertion.</text><text x="34.756" y="178.849" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Drawing extension</text><text x="34.756" y="182.629" font-size="2.8" text-anchor="start" fill="#101418">.slddrw in SOLIDWORKS. ModelForge uses its own project bundle plus exported</text><text x="34.756" y="186.409" font-size="2.8" text-anchor="start" fill="#101418">SVG and must not mislabel those.slddrw.</text><text x="34.756" y="194.37" font-size="2.8" text-anchor="start" fill="#101418">Q9 - TimesNewRoman/lowercase</text><text x="34.756" y="198.15" font-size="2.8" text-anchor="start" fill="#101418">False. Engineering lettering prioritizes readable consistent lettering;the</text><text x="34.756" y="201.93" font-size="2.8" text-anchor="start" fill="#101418">source uses standard drafting fonts such as Century Gothic and generally</text><text x="34.756" y="205.71" font-size="2.8" text-anchor="start" fill="#101418">uppercase drawing notes,not all-lowercaseTimesNewRoman.</text><text x="34.756" y="213.395" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Leader</text><text x="34.756" y="217.175" font-size="2.8" text-anchor="start" fill="#101418">A thin annotation line connecting a note/symbol to a feature,with an</text><text x="34.756" y="220.955" font-size="2.8" text-anchor="start" fill="#101418">appropriate arrow/dot end. Example:aØholeTHRU callout pointing at the hole.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Drawing Note</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Text conveying information not efficiently expressed by</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">geometry/dimensions,e.g.material,finish or a linked thickness note. An</text><text x="225.012" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">associative note can read the model property.</text><text x="225.012" y="78.714" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Exploded assembly drawing</text><text x="225.012" y="82.494" font-size="2.8" text-anchor="start" fill="#101418">Create/save an exploded configuration/view in the assembly;insert an</text><text x="225.012" y="86.274" font-size="2.8" text-anchor="start" fill="#101418">assembly drawing view selecting that configuration and enable its exploded</text><text x="225.012" y="90.054" font-size="2.8" text-anchor="start" fill="#101418">state. Keep the underlying assembly&#39;s collapse/edit state available.</text><text x="225.012" y="97.74" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Label exploded components</text><text x="225.012" y="101.52" font-size="2.8" text-anchor="start" fill="#101418">Insert BOM,then attach balloons to component occurrences;balloon item</text><text x="225.012" y="105.3" font-size="2.8" text-anchor="start" fill="#101418">numbers correspond to BOM rows. Example:LINKS four occurrence balloons/four</text><text x="225.012" y="109.08" font-size="2.8" text-anchor="start" fill="#101418">source part numbers.</text><text x="225.012" y="116.765" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Design Table</text><text x="225.012" y="120.545" font-size="2.8" text-anchor="start" fill="#101418">Book:Insert→Tables→Design Table;choose creation method,add configuration</text><text x="225.012" y="124.325" font-size="2.8" text-anchor="start" fill="#101418">rows and dimension/feature/property columns,enter values,and close/update.</text><text x="225.012" y="128.105" font-size="2.8" text-anchor="start" fill="#101418">O-RING path/profile dimensions define Small/Medium/Large. ModelForge&#39;s</text><text x="225.012" y="131.885" font-size="2.8" text-anchor="start" fill="#101418">native table is an equivalent,not an Excel automation claim.</text><text x="225.012" y="139.296" font-size="2.8" text-anchor="start" fill="#101418">Q15 - No multiple configurations on sheet</text><text x="225.012" y="143.076" font-size="2.8" text-anchor="start" fill="#101418">False. Each drawing view can reference a chosen configuration;different</text><text x="225.012" y="146.856" font-size="2.8" text-anchor="start" fill="#101418">configurations can appear on the same sheet.</text><text x="225.012" y="154.817" font-size="2.8" text-anchor="start" fill="#101418">Q16 - Part number only in BOM</text><text x="225.012" y="158.597" font-size="2.8" text-anchor="start" fill="#101418">False. It can originate from configuration/component/custom properties and</text><text x="225.012" y="162.377" font-size="2.8" text-anchor="start" fill="#101418">also appear in linked drawing notes/titleblocks;the BOM reads its selected</text><text x="225.012" y="166.157" font-size="2.8" text-anchor="start" fill="#101418">property.</text><text x="225.012" y="173.842" font-size="2.8" text-anchor="start" fill="#101418">Q17 - Find detailed options help</text><text x="225.012" y="177.622" font-size="2.8" text-anchor="start" fill="#101418">Use context/PropertyManager help,SOLIDWORKS Help/search and relevant</text><text x="225.012" y="181.402" font-size="2.8" text-anchor="start" fill="#101418">tutorials;the book&#39;s menus are2021source instructions.</text><text x="225.012" y="189.363" font-size="2.8" text-anchor="start" fill="#101418">Q18 - View Palette</text><text x="225.012" y="193.143" font-size="2.8" text-anchor="start" fill="#101418">A task-pane collection of available standard/model views from the selected</text><text x="225.012" y="196.923" font-size="2.8" text-anchor="start" fill="#101418">model that can be dragged onto a sheet. It helps insert views but does not</text><text x="225.012" y="200.703" font-size="2.8" text-anchor="start" fill="#101418">determine source dimensions by itself.</text><text x="225.012" y="208.389" font-size="2.8" text-anchor="start" fill="#101418">Q19 - COM in drawing</text><text x="225.012" y="212.169" font-size="2.8" text-anchor="start" fill="#101418">First create a Center of Mass feature in the part/assembly via</text><text x="225.012" y="215.949" font-size="2.8" text-anchor="start" fill="#101418">Insert→Reference Geometry→Center of Mass or Mass Properties&#39;createCOM</text><text x="225.012" y="219.729" font-size="2.8" text-anchor="start" fill="#101418">option. In Drawing use Insert→Model Items→Reference Geometry→Center of Mass</text><text x="225.012" y="223.509" font-size="2.8" text-anchor="start" fill="#101418">and accept. Its location updates with model mass distribution;it is</text><text x="225.012" y="227.289" font-size="2.8" text-anchor="start" fill="#101418">distinct from a frozen COM Reference Point. Source PDF470–471/9-36–37.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER9 - REVIEW Q1-Q19</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD9-38/39-PDF472/473</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
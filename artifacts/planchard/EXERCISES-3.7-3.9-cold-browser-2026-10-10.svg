280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.747" y="99.875" font-size="2.8" text-anchor="start" fill="#101418">1.001</text><text x="34.747" y="103.655" font-size="2.8" text-anchor="start" fill="#101418">.999</text><text x="35.748" y="18.808" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.7 / PDF178 / 3-50</text><text x="35.748" y="22.588" font-size="2.8" text-anchor="start" fill="#101418">Stacked upper/lower limit dimension in inches.</text><text x="35.748" y="26.368" font-size="2.8" text-anchor="start" fill="#101418">Maximum1.001; minimum.999.</text><text x="35.748" y="30.148" font-size="2.8" text-anchor="start" fill="#101418">Total tolerance1.001-.999=.002in.</text><text x="35.748" y="33.928" font-size="2.8" text-anchor="start" fill="#101418">Equivalent symmetric variation±.001in.</text><text x="35.748" y="37.708" font-size="2.8" text-anchor="start" fill="#101418">Cylinder side projection; length unspecified.</text><text x="235.911" y="18.808" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.8 / PDF178 / 3-50</text><text x="235.911" y="22.588" font-size="2.8" text-anchor="start" fill="#101418">Three common tolerance types:</text><text x="235.911" y="26.368" font-size="2.8" text-anchor="start" fill="#101418">1. Limit.</text><text x="235.911" y="30.148" font-size="2.8" text-anchor="start" fill="#101418">2. Bilateral.</text><text x="235.911" y="33.928" font-size="2.8" text-anchor="start" fill="#101418">3. Unilateral.</text><text x="235.911" y="37.708" font-size="2.8" text-anchor="start" fill="#101418">Limit values directly show maximum/minimum.</text><text x="235.911" y="88.866" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE 3.9 / PDF178 / 3-50</text><text x="235.911" y="92.646" font-size="2.8" text-anchor="start" fill="#101418">Source rows top-to-bottom:</text><text x="235.911" y="96.426" font-size="2.8" text-anchor="start" fill="#101418">1. Symbol absent: unresolved in supplied PDF.</text><text x="235.911" y="100.206" font-size="2.8" text-anchor="start" fill="#101418">2. Counterbore.</text><text x="235.911" y="103.986" font-size="2.8" text-anchor="start" fill="#101418">3. Diameter.</text><text x="235.911" y="107.766" font-size="2.8" text-anchor="start" fill="#101418">4. Damaged V/dots: identity unresolved.</text><text x="235.911" y="148.915" font-size="2.8" text-anchor="start" fill="#101418">SOURCE SYMBOL QUALIFICATION</text><text x="235.911" y="152.695" font-size="2.8" text-anchor="start" fill="#101418">Blank/damaged rows are not recoverable answers.</text><text x="235.911" y="156.475" font-size="2.8" text-anchor="start" fill="#101418">Do not invent a glyph or certified row order.</text><text x="235.911" y="160.255" font-size="2.8" text-anchor="start" fill="#101418">Row2/3 follow the visible source forms.</text><text x="235.911" y="164.035" font-size="2.8" text-anchor="start" fill="#101418">Known glossary symbols are separate evidence.</text><text x="235.911" y="167.815" font-size="2.8" text-anchor="start" fill="#101418">Recheck against a legible source if provided.</text><text x="35.748" y="178.939" font-size="2.8" text-anchor="start" fill="#101418">MANUAL WORKSHEET QUALIFICATION</text><text x="35.748" y="182.719" font-size="2.8" text-anchor="start" fill="#101418">The limit applies to the source1.000 diameter.</text><text x="35.748" y="186.499" font-size="2.8" text-anchor="start" fill="#101418">Paper rectangle and arrowheads are native annotations.</text><text x="35.748" y="190.279" font-size="2.8" text-anchor="start" fill="#101418">No associative CAD dimension or tolerance driver.</text><text x="35.748" y="194.059" font-size="2.8" text-anchor="start" fill="#101418">No unspecified physical cylinder length invented.</text><text x="35.748" y="197.839" font-size="2.8" text-anchor="start" fill="#101418">The source requests a total tolerance of.002in.</text><line x1="55" y1="95" x2="135" y2="95" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="135" y1="95" x2="135" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="135" y1="115" x2="55" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="55" y1="115" x2="55" y2="95" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="49.764" y1="104.874" x2="139.838" y2="104.874" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><line x1="39.756" y1="94.866" x2="53.768" y2="94.866" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="114.882" x2="53.768" y2="114.882" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="94.866" x2="39.756" y2="99.87" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="110.879" x2="39.756" y2="114.882" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="39.756" y1="94.866" x2="38.755" y2="97.868" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="38.755" y1="97.868" x2="40.757" y2="97.868" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="40.757" y1="97.868" x
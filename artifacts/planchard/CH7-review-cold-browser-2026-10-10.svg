8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER7 - REVIEW ANSWERS Q1-Q16</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed7-60 / PDF368, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations with procedural examples.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Six feature functions</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Sweep extends a profile along a path;Revolved Cut Thin removes a</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">thickness-controlled revolved region;Loft joins ordered profiles into added</text><text x="34.756" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">volume;Rib adds a thickness-controlled reinforcement from a guide</text><text x="34.756" y="74.808" font-size="2.8" text-anchor="start" fill="#101418">sketch;Circular Pattern repeats around an axis;Linear Pattern repeats along</text><text x="34.756" y="78.588" font-size="2.8" text-anchor="start" fill="#101418">one/two directions.</text><text x="34.756" y="88.728" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Suppressed feature</text><text x="34.756" y="92.508" font-size="2.8" text-anchor="start" fill="#101418">A retained feature excluded from the current rebuild/configuration,with</text><text x="34.756" y="96.288" font-size="2.8" text-anchor="start" fill="#101418">downstream effects handled through its dependencies.</text><text x="34.756" y="107.253" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Why suppress</text><text x="34.756" y="111.033" font-size="2.8" text-anchor="start" fill="#101418">Compare design alternatives,simplify a configuration or computation,and</text><text x="34.756" y="114.813" font-size="2.8" text-anchor="start" fill="#101418">temporarily exclude a feature without deleting its definition.</text><text x="34.756" y="125.777" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Rib input requirements</text><text x="34.756" y="129.557" font-size="2.8" text-anchor="start" fill="#101418">A sketch/guide,thickness,and growth direction;also set side placement,end</text><text x="34.756" y="133.337" font-size="2.8" text-anchor="start" fill="#101418">conditions/draft where applicable.</text><text x="34.756" y="144.302" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Pierce</text><text x="34.756" y="148.082" font-size="2.8" text-anchor="start" fill="#101418">Constrains a sketch point to the intersection of a selected curve with the</text><text x="34.756" y="151.862" font-size="2.8" text-anchor="start" fill="#101418">sketch plane,commonly linking a sweep profile to its path or a loft section</text><text x="34.756" y="155.642" font-size="2.8" text-anchor="start" fill="#101418">to a guide.</text><text x="34.756" y="166.332" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Swept thread</text><text x="34.756" y="170.112" font-size="2.8" text-anchor="start" fill="#101418">Create a helix/spiral path,draw a thread cross-section on a suitable</text><text x="34.756" y="173.892" font-size="2.8" text-anchor="start" fill="#101418">plane,constrain it to the path withPierce,and sweep-add/cut it.</text><text x="34.756" y="177.672" font-size="2.8" text-anchor="start" fill="#101418">Example:LENSCAP&#39;s linked helical swept thread. A helix alone is not a solid</text><text x="34.756" y="181.452" font-size="2.8" text-anchor="start" fill="#101418">thread.</text><text x="34.756" y="191.866" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Linear Pattern procedure</text><text x="34.756" y="195.646" font-size="2.8" text-anchor="start" fill="#101418">Select a seed,select a directional edge/axis,set spacing/count and optional</text><text x="34.756" y="199.426" font-size="2.8" text-anchor="start" fill="#101418">second direction,preview required instances,and accept. Example:repeated</text><text x="34.756" y="203.206" font-size="2.8" text-anchor="start" fill="#101418">flat-bar holes.</text><text x="34.756" y="213.896" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Convert advantages</text><text x="34.756" y="217.676" font-size="2.8" text-anchor="start" fill="#101418">Reuses exact existing shape and retains geometric association,avoiding</text><text x="34.756" y="221.456" font-size="2.8" text-anchor="start" fill="#101418">manual remeasurement/redrawing and allowing upstream changes to propagate.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Sketch symmetry example</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Use a centered rectangle or pairs of entities constrained symmetric about a</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">construction centerline;dimension the shared width and offsets.</text><text x="225.012" y="78.213" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Feature symmetry example</text><text x="225.012" y="81.993" font-size="2.8" text-anchor="start" fill="#101418">Use Mid-plane extrusion about the sketch plane or mirror selected features</text><text x="225.012" y="85.773" font-size="2.8" text-anchor="start" fill="#101418">about a reference plane.</text><text x="225.012" y="96.738" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Guide curve</text><text x="225.012" y="100.518" font-size="2.8" text-anchor="start" fill="#101418">A curve intersecting/corresponding to section profiles that steers shape</text><text x="225.012" y="104.298" font-size="2.8" text-anchor="start" fill="#101418">between them. Sweeps and lofts can use guide curves;each profile/guide</text><text x="225.012" y="108.078" font-size="2.8" text-anchor="start" fill="#101418">intersection must be consistent.</text><text x="225.012" y="118.768" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Draft feature</text><text x="225.012" y="122.548" font-size="2.8" text-anchor="start" fill="#101418">Tapers selected existing faces relative to a neutral plane/parting line and</text><text x="225.012" y="126.328" font-size="2.8" text-anchor="start" fill="#101418">pull direction to support removal from a mold.</text><text x="225.012" y="137.293" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Feature draft versus extrusion draft</text><text x="225.012" y="141.073" font-size="2.8" text-anchor="start" fill="#101418">Extrusion Draft Angle tapers walls while creating that extrusion;separate</text><text x="225.012" y="144.853" font-size="2.8" text-anchor="start" fill="#101418">Draft modifies selected existing faces and provides independent</text><text x="225.012" y="148.633" font-size="2.8" text-anchor="start" fill="#101418">neutral-plane/parting-line scope.</text><text x="225.012" y="159.323" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Pattern difference</text><text x="225.012" y="163.103" font-size="2.8" text-anchor="start" fill="#101418">Circular uses angular positions around an axis;Linear uses translated</text><text x="225.012" y="166.883" font-size="2.8" text-anchor="start" fill="#101418">spacing along directional references.</text><text x="225.012" y="177.848" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Convert Entities advantages</text><text x="225.012" y="181.628" font-size="2.8" text-anchor="start" fill="#101418">Accurate reuse,less redundant sketch work and persistent source</text><text x="225.012" y="185.408" font-size="2.8" text-anchor="start" fill="#101418">association. Example:converted perimeter used by an offset or swept cut.</text><text x="225.012" y="196.373" font-size="2.8" text-anchor="start" fill="#101418">Q16 - Loft only first feature</text><text x="225.012" y="200.153" font-size="2.8" text-anchor="start" fill="#101418">False. A Lofted Base can start a part;Lofted Boss can add to an existing</text><text x="225.012" y="203.933" font-size="2.8" text-anchor="start" fill="#101418">part. Order depends on the intended geometry and dependencies.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER7 - REVIEW Q1-Q16</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD7-60/PDF368</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
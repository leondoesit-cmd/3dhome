8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER5 - REVIEW ANSWERS Q1-Q19</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed5-38/39 / PDF256/257, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations and source icon identifications.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Four features</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Extruded Boss/Base adds material by extending a profile;Fillet rounds</text><text x="34.756" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">selected edges/faces;Chamfer bevels an edge;Extruded Cut removes material</text><text x="34.756" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">using a profile and end condition.</text><text x="34.756" y="78.714" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Template versus part</text><text x="34.756" y="82.494" font-size="2.8" text-anchor="start" fill="#101418">A template stores starting defaults such as units,standard and document</text><text x="34.756" y="86.274" font-size="2.8" text-anchor="start" fill="#101418">properties; a part document stores the particular model and its</text><text x="34.756" y="90.054" font-size="2.8" text-anchor="start" fill="#101418">feature/sketch history. Book extensions:.prtdot versus.sldprt.</text><text x="34.756" y="97.74" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Start session</text><text x="34.756" y="101.52" font-size="2.8" text-anchor="start" fill="#101418">Book workflow:launch SOLIDWORKS,choose File→New,select a Part template,then</text><text x="34.756" y="105.3" font-size="2.8" text-anchor="start" fill="#101418">choose a sketch plane/face. ModelForge equivalent is opening the local app</text><text x="34.756" y="109.08" font-size="2.8" text-anchor="start" fill="#101418">and creating a new Model document; do not claim the original</text><text x="34.756" y="112.86" font-size="2.8" text-anchor="start" fill="#101418">executable/menu was exercised.</text><text x="34.756" y="120.27" font-size="2.8" text-anchor="start" fill="#101418">Q4 - New2D sketch</text><text x="34.756" y="124.05" font-size="2.8" text-anchor="start" fill="#101418">Select a plane/planar face,start Sketch,draw entities,apply relations and</text><text x="34.756" y="127.83" font-size="2.8" text-anchor="start" fill="#101418">dimensions to express intent,finish the sketch,and create the required</text><text x="34.756" y="131.61" font-size="2.8" text-anchor="start" fill="#101418">feature.</text><text x="34.756" y="139.296" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Inches to millimeters</text><text x="34.756" y="143.076" font-size="2.8" text-anchor="start" fill="#101418">Book:change document units in Options→Document Properties→Units or the</text><text x="34.756" y="146.856" font-size="2.8" text-anchor="start" fill="#101418">document units control,using MMGS. A unit change converts numerical display</text><text x="34.756" y="150.636" font-size="2.8" text-anchor="start" fill="#101418">and does not physically rescale the part.</text><text x="34.756" y="158.321" font-size="2.8" text-anchor="start" fill="#101418">Q6 - Default planes</text><text x="34.756" y="162.101" font-size="2.8" text-anchor="start" fill="#101418">Front,Top,Right.</text><text x="34.756" y="170.338" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Base feature</text><text x="34.756" y="174.118" font-size="2.8" text-anchor="start" fill="#101418">The first solid-producing feature on which later features depend,e.g.a</text><text x="34.756" y="177.898" font-size="2.8" text-anchor="start" fill="#101418">rectangle extruded into a block.</text><text x="34.756" y="185.858" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Boss/cut/fillet</text><text x="34.756" y="189.638" font-size="2.8" text-anchor="start" fill="#101418">Boss adds profile-derived volume;Cut removes profile-derived volume;Fillet</text><text x="34.756" y="193.418" font-size="2.8" text-anchor="start" fill="#101418">rounds an existing edge/transition.</text><text x="34.756" y="201.379" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Black sketch</text><text x="34.756" y="205.159" font-size="2.8" text-anchor="start" fill="#101418">Fully defined in the book&#39;s default sketch-color convention.</text><text x="34.756" y="213.395" font-size="2.8" text-anchor="start" fill="#101418">Q10 - Blue sketch</text><text x="34.756" y="217.175" font-size="2.8" text-anchor="start" fill="#101418">Under defined:one or more degrees of freedom remain.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Red/yellow sketch</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Over defined or conflicting/problem geometry in the source convention.</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">Examine diagnostics rather than treating color alone as a solved sketch.</text><text x="225.012" y="75.209" font-size="2.8" text-anchor="start" fill="#101418">Q12 - Folders only store part files</text><text x="225.012" y="78.989" font-size="2.8" text-anchor="start" fill="#101418">False. FeatureManager folders organize features/items; document folders may</text><text x="225.012" y="82.769" font-size="2.8" text-anchor="start" fill="#101418">contain multiple file types.</text><text x="225.012" y="90.73" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Symmetric relation</text><text x="225.012" y="94.51" font-size="2.8" text-anchor="start" fill="#101418">Paired entities have reflected positions/geometry about a construction</text><text x="225.012" y="98.29" font-size="2.8" text-anchor="start" fill="#101418">centerline; moving one preserves symmetry of its partner.</text><text x="225.012" y="106.251" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Angular dimension</text><text x="225.012" y="110.031" font-size="2.8" text-anchor="start" fill="#101418">A dimension that controls or reports the included angle between suitable</text><text x="225.012" y="113.811" font-size="2.8" text-anchor="start" fill="#101418">lines/entities,or an entity&#39;s angle to a reference.</text><text x="225.012" y="121.772" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Draft angle</text><text x="225.012" y="125.552" font-size="2.8" text-anchor="start" fill="#101418">A taper on walls relative to the pull direction,facilitating mold release.</text><text x="225.012" y="129.332" font-size="2.8" text-anchor="start" fill="#101418">Example:a molded container whose walls narrow toward one end.</text><text x="225.012" y="137.293" font-size="2.8" text-anchor="start" fill="#101418">Q16 - Arc points</text><text x="225.012" y="141.073" font-size="2.8" text-anchor="start" fill="#101418">Three defining points for the source arc constructions:3-point arc uses two</text><text x="225.012" y="144.853" font-size="2.8" text-anchor="start" fill="#101418">ends and a point on the arc;centerpoint arc uses center,start,end. A</text><text x="225.012" y="148.633" font-size="2.8" text-anchor="start" fill="#101418">tangent-arc interaction additionally derives its initial tangent from</text><text x="225.012" y="152.413" font-size="2.8" text-anchor="start" fill="#101418">existing geometry.</text><text x="225.012" y="159.823" font-size="2.8" text-anchor="start" fill="#101418">Q17 - Multi-body part</text><text x="225.012" y="163.603" font-size="2.8" text-anchor="start" fill="#101418">One part document contains separate solid bodies,which can be operated on</text><text x="225.012" y="167.383" font-size="2.8" text-anchor="start" fill="#101418">with body/feature scope and later combined or saved separately. It is not</text><text x="225.012" y="171.163" font-size="2.8" text-anchor="start" fill="#101418">automatically an assembly of independently mated components.</text><text x="225.012" y="178.849" font-size="2.8" text-anchor="start" fill="#101418">Q18 - Feature iconsA–F</text><text x="225.012" y="182.629" font-size="2.8" text-anchor="start" fill="#101418">A Extruded Boss/Base;B Linear Pattern;C Draft;D Shell;E Revolved</text><text x="225.012" y="186.409" font-size="2.8" text-anchor="start" fill="#101418">Boss/Base;F Mirror. Source PDF257 rendered and visually inspected,not</text><text x="225.012" y="190.189" font-size="2.8" text-anchor="start" fill="#101418">identified from OCR symbols.</text><text x="225.012" y="197.875" font-size="2.8" text-anchor="start" fill="#101418">Q19 - Sketch iconsA–J</text><text x="225.012" y="201.655" font-size="2.8" text-anchor="start" fill="#101418">A Line;B Smart Dimension;C Centerline;D Circle;E Corner Rectangle;F Offset</text><text x="225.012" y="205.435" font-size="2.8" text-anchor="start" fill="#101418">Entities;G Tangent Arc;H Convert Entities;I Point;J Polygon. Source PDF257</text><text x="225.012" y="209.215" font-size="2.8" text-anchor="start" fill="#101418">visually inspected;G cross-checked against the source arc flyout on PDF274.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER5 - REVIEW Q1-Q19</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD5-38/39-PDF256/257</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
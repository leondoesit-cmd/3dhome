8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="69.724" y="117.879" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER 1 REVIEW | 1-51 / PDF79</text><text x="69.724" y="121.659" font-size="2.8" text-anchor="start" fill="#101418">Independent answers; source conventions.</text><text x="69.724" y="125.439" font-size="2.8" text-anchor="start" fill="#101418">Q1: Perpendicular X/Y/Z axes locate points</text><text x="69.724" y="129.219" font-size="2.8" text-anchor="start" fill="#101418">by signed distances from their origin.</text><text x="69.724" y="132.999" font-size="2.8" text-anchor="start" fill="#101418">Q2: Origin, coordinates (0,0,0).</text><text x="69.724" y="136.779" font-size="2.8" text-anchor="start" fill="#101418">Q3: Right-hand fingers X then Y; thumb Z.</text><text x="69.724" y="140.559" font-size="2.8" text-anchor="start" fill="#101418">Curl from +X toward +Y gives +Z.</text><text x="69.724" y="144.339" font-size="2.8" text-anchor="start" fill="#101418">Q4: Freehand sketches quickly communicate</text><text x="69.724" y="148.119" font-size="2.8" text-anchor="start" fill="#101418">shape, proportions and design ideas.</text><text x="69.724" y="151.899" font-size="2.8" text-anchor="start" fill="#101418">Q5: First-angle: object before plane;</text><text x="69.724" y="155.679" font-size="2.8" text-anchor="start" fill="#101418">Top below Front, Right placed left.</text><text x="69.724" y="159.459" font-size="2.8" text-anchor="start" fill="#101418">Third-angle: plane before object;</text><text x="69.724" y="163.239" font-size="2.8" text-anchor="start" fill="#101418">Top above Front, Right placed right.</text><text x="69.724" y="167.019" font-size="2.8" text-anchor="start" fill="#101418">Q6: False. US generally uses third-angle.</text><text x="69.724" y="170.799" font-size="2.8" text-anchor="start" fill="#101418">Q7: Coincident lines follow precedence:</text><text x="69.724" y="174.579" font-size="2.8" text-anchor="start" fill="#101418">visible before hidden before center.</text><text x="69.724" y="178.359" font-size="2.8" text-anchor="start" fill="#101418">Q8: False. Visible lines take precedence.</text><text x="279.724" y="117.879" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER 1 REVIEW | QUESTIONS 9-15</text><text x="279.724" y="121.659" font-size="2.8" text-anchor="start" fill="#101418">Q9: True. X/Y divide a plane into four</text><text x="279.724" y="125.439" font-size="2.8" text-anchor="start" fill="#101418">quadrants I, II, III, IV.</text><text x="279.724" y="129.219" font-size="2.8" text-anchor="start" fill="#101418">Q10: Project an enclosed object normally</text><text x="279.724" y="132.999" font-size="2.8" text-anchor="start" fill="#101418">onto glass-box faces; unfold those faces</text><text x="279.724" y="136.779" font-size="2.8" text-anchor="start" fill="#101418">to obtain aligned orthographic views.</text><text x="279.724" y="140.559" font-size="2.8" text-anchor="start" fill="#101418">Q11: True. Both produce the same six</text><text x="279.724" y="144.339" font-size="2.8" text-anchor="start" fill="#101418">principal views, arranged differently.</text><text x="279.724" y="148.119" font-size="2.8" text-anchor="start" fill="#101418">Q12: True. Section hatch conventions</text><text x="279.724" y="151.899" font-size="2.8" text-anchor="start" fill="#101418">can indicate material categories.</text><text x="279.724" y="155.679" font-size="2.8" text-anchor="start" fill="#101418">Q13: True in this book mechanical context:</text><text x="279.724" y="159.459" font-size="2.8" text-anchor="start" fill="#101418">dimension lines end in arrowheads.</text><text x="279.724" y="163.239" font-size="2.8" text-anchor="start" fill="#101418">Architectural slash/dot conventions differ.</text><text x="279.724" y="167.019" font-size="2.8" text-anchor="start" fill="#101418">Q14: True for the book combined wording.</text><text x="279.724" y="170.799" font-size="2.8" text-anchor="start" fill="#101418">A broken view shortens a long shaft;</text><text x="279.724" y="174.579" font-size="2.8" text-anchor="start" fill="#101418">a local broken-out section reveals a bore.</text><text x="279.724" y="178.359" font-size="2.8" text-anchor="start" fill="#101418">Q15: True. Choose the most informative</text><text x="279.724" y="182.139" font-size="2.8" text-anchor="start" fill="#101418">Front with few hidden lines; project all</text><text x="279.724" y="185.919" font-size="2.8" text-anchor="start" fill="#101418">other views consistently from that choice.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280"></text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">New model</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
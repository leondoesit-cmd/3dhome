hor="start" fill="#101418">Top: hidden stem edges and hidden bore boundaries run along depth.</text><text x="39.763" y="213.971" font-size="2.8" text-anchor="start" fill="#101418">Bore interpreted through depth; its circle is visible in Front.</text><text x="39.763" y="217.751" font-size="2.8" text-anchor="start" fill="#101418">Front conveys the T outline and the circular bore most clearly.</text><line x1="40" y1="150" x2="115" y2="150" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="115" y1="150" x2="115" y2="165" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="115" y1="165" x2="90" y2="165" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="90" y1="165" x2="90" y2="195" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="90" y1="195" x2="65" y2="195" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="65" y1="195" x2="65" y2="165" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="65" y1="165" x2="40" y2="165" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="40" y1="165" x2="40" y2="150" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="77.5" cy="157.5" r="5" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="40" y1="65" x2="115" y2="65" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="115" y1="65" x2="115" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="115" y1="115" x2="40" y2="115" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="40" y1="115" x2="40" y2="65" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="160" y1="150" x2="210" y2="150" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="210" y1="150" x2="210" y2="195" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="210" y1="195" x2="160" y2="195" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="160" y1="195" x2="160" y2="150" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="160" y1="165" x2="210" y2="165" fill="none" stroke="#101418" stroke-wi
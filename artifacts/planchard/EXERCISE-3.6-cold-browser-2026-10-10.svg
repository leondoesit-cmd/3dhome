="start" fill="#101418">Arcs reproduceR.25; holes reproduceØ.19.</text><text x="35.748" y="33.928" font-size="2.8" text-anchor="start" fill="#101418">4.00 is first-to-last holecenter distance.</text><text x="35.748" y="37.708" font-size="2.8" text-anchor="start" fill="#101418">Manual paper annotations; no CAD drivers.</text><text x="235.911" y="58.841" font-size="2.8" text-anchor="start" fill="#101418">CIRCLED SOURCE ERRORS</text><text x="235.911" y="62.621" font-size="2.8" text-anchor="start" fill="#101418">Ø.19 omits the quantity: use9X Ø.19.</text><text x="235.911" y="66.401" font-size="2.8" text-anchor="start" fill="#101418">Hole location and spacing are unspecified.</text><text x="235.911" y="70.181" font-size="2.8" text-anchor="start" fill="#101418">Two R.25 notes repeat the same size.</text><text x="235.911" y="73.961" font-size="2.8" text-anchor="start" fill="#101418">Use2X R.25 to identify both ends.</text><text x="235.911" y="77.741" font-size="2.8" text-anchor="start" fill="#101418">Thickness .10 is a source material note.</text><text x="235.911" y="123.894" font-size="2.8" text-anchor="start" fill="#101418">QUALIFIED SPACING INTERPRETATION</text><text x="235.911" y="127.674" font-size="2.8" text-anchor="start" fill="#101418">Chosen equal spacing:8spaces at.50=4.00.</text><text x="235.911" y="131.454" font-size="2.8" text-anchor="start" fill="#101418">The source does not explicitly specify it.</text><text x="235.911" y="135.234" font-size="2.8" text-anchor="start" fill="#101418">Keep the first-to-last center distance4.00.</text><text x="235.911" y="139.014" font-size="2.8" text-anchor="start" fill="#101418">Do not add a redundant closed dimension chain.</text><text x="235.911" y="142.794" font-size="2.8" text-anchor="start" fill="#101418">This interpretation is not a publisher answer key.</text><text x="35.748" y="183.943" font-size="2.8" text-anchor="start" fill="#101418">SOURCE / CORRECTION SCOPE</text><text x="35.748" y="187.723" font-size="2.8" text-anchor="start" fill="#101418">The drawn capsule and labels retain source layout.</text><text x="35.748" y="191.503" font-size="2.8" text-anchor="start" fill="#101418">Circles mark missing quantity and duplicate radii.</text><text x="35.748" y="195.283" font-size="2.8" text-anchor="start" fill="#101418">Hole positions illustrate the chosen equal-spacing interpretation.</text><text x="35.748" y="199.063" font-size="2.8" text-anchor="start" fill="#101418">No new physical tolerance or material is invented.</text><text x="35.748" y="202.843" font-size="2.8" text-anchor="start" fill="#101418">Corrected callouts are described in the answer notes.</text><line x1="54.768" y1="98.619" x2="154.85" y2="98.619" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="154.85" y1="111.129" x2="54.768" y2="111.129" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="44.76" y1="104.874" x2="164.858" y2="104.874" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><path d="M154.85,98.619A6.255,6.255 0 1 1 154.85,111.129" fill="none" stroke="#101418" stroke-width="0.5"/><path d="M54.768,111.129A6.255,6.255 0 1 1 54.768,98.619" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="54.768" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="67.279" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="79.789" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="92.299" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="104.809" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="117.319" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="129.83" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="142.34" cy="104.874" r="2.377" fill="none" stroke="#101418" stroke-width="0.5"/><circle cx="154.85" cy="104.874" r="2.377" fill=
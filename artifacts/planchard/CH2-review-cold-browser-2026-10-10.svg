8" x2="263.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="263.5" y1="285" x2="263.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="288.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">3</text><text x="288.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">3</text><line x1="313" y1="8" x2="313" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="313" y1="285" x2="313" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="337.75" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">2</text><text x="337.75" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">2</text><line x1="362.5" y1="8" x2="362.5" y2="12" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="362.5" y1="285" x2="362.5" y2="289" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="387.25" y="11.4" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="387.25" y="287.8" font-size="2" text-anchor="middle" fill="#6b7280">1</text><text x="18" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><text x="410" y="32.417" font-size="2" text-anchor="middle" fill="#6b7280">F</text><line x1="16" y1="54.833" x2="20" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="54.833" x2="412" y2="54.833" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><text x="410" y="79.25" font-size="2" text-anchor="middle" fill="#6b7280">E</text><line x1="16" y1="101.667" x2="20" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="101.667" x2="412" y2="101.667" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><text x="410" y="126.083" font-size="2" text-anchor="middle" fill="#6b7280">D</text><line x1="16" y1="148.5" x2="20" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="34.756" y="24.641" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER2 - REVIEW ANSWERS Q1-Q15</text><text x="34.756" y="28.421" font-size="2.8" text-anchor="start" fill="#101418">Source: printed2-37 / PDF123, Planchard2021.</text><text x="34.756" y="32.201" font-size="2.8" text-anchor="start" fill="#101418">Independent explanations; required symbols on companion.</text><text x="34.756" y="35.981" font-size="2.8" text-anchor="start" fill="#101418">No official answer-key, authored CAD or certification claim.</text><text x="34.756" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q1 - Projection divisions</text><text x="34.756" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Axonometric,Oblique,Perspective.</text><text x="34.756" y="71.705" font-size="2.8" text-anchor="start" fill="#101418">Q2 - Axonometric types</text><text x="34.756" y="75.485" font-size="2.8" text-anchor="start" fill="#101418">Isometric,Dimetric,Trimetric: three equal axis scales,two equal scales,or</text><text x="34.756" y="79.265" font-size="2.8" text-anchor="start" fill="#101418">three different scales respectively.</text><text x="34.756" y="87.226" font-size="2.8" text-anchor="start" fill="#101418">Q3 - Oblique front</text><text x="34.756" y="91.006" font-size="2.8" text-anchor="start" fill="#101418">True. The front face is drawn in true shape/size; depth recedes obliquely.</text><text x="34.756" y="99.242" font-size="2.8" text-anchor="start" fill="#101418">Q4 - Oblique types</text><text x="34.756" y="103.022" font-size="2.8" text-anchor="start" fill="#101418">Cavalier and Cabinet. Cavalier uses full receding depth; Cabinet uses half</text><text x="34.756" y="106.802" font-size="2.8" text-anchor="start" fill="#101418">depth to reduce apparent distortion.</text><text x="34.756" y="114.763" font-size="2.8" text-anchor="start" fill="#101418">Q5 - Perspective</text><text x="34.756" y="118.543" font-size="2.8" text-anchor="start" fill="#101418">Projection rays converge at a viewpoint; parallel directions may converge</text><text x="34.756" y="122.323" font-size="2.8" text-anchor="start" fill="#101418">to vanishing points and distant features appear smaller. Example: railway</text><text x="34.756" y="126.103" font-size="2.8" text-anchor="start" fill="#101418">tracks receding toward the horizon.</text><text x="34.756" y="133.788" font-size="2.8" text-anchor="start" fill="#101418">Q6 - One view for uniform parts</text><text x="34.756" y="137.568" font-size="2.8" text-anchor="start" fill="#101418">True when one view plus dimensions/notes completely defines the part, e.g.a</text><text x="34.756" y="141.348" font-size="2.8" text-anchor="start" fill="#101418">simple turned cylindrical part with diameter and length. Complex geometry</text><text x="34.756" y="145.128" font-size="2.8" text-anchor="start" fill="#101418">still needs additional views.</text><text x="34.756" y="152.814" font-size="2.8" text-anchor="start" fill="#101418">Q7 - Front chosen by description</text><text x="34.756" y="156.594" font-size="2.8" text-anchor="start" fill="#101418">True. Use the view that best describes general shape; it need not coincide</text><text x="34.756" y="160.374" font-size="2.8" text-anchor="start" fill="#101418">with the assembly&#39;s installed front.</text><text x="34.756" y="168.335" font-size="2.8" text-anchor="start" fill="#101418">Q8 - Diameter symbol</text><text x="34.756" y="172.115" font-size="2.8" text-anchor="start" fill="#101418">True. Prefix the cylindrical diameter withØ; the OCR&#39;s0 is a</text><text x="34.756" y="175.895" font-size="2.8" text-anchor="start" fill="#101418">diameter-symbol substitution, not the numeral zero.</text><text x="225.012" y="59.688" font-size="2.8" text-anchor="start" fill="#101418">Q9 - Third-angle symbol</text><text x="225.012" y="63.468" font-size="2.8" text-anchor="start" fill="#101418">Draw the standard truncated-cone side view plus its aligned</text><text x="225.012" y="67.248" font-size="2.8" text-anchor="start" fill="#101418">concentric-circle end view in third-angle arrangement. The actual source</text><text x="225.012" y="71.028" font-size="2.8" text-anchor="start" fill="#101418">PDF102/2-16 draws the frustum with larger end at RIGHT,smaller end at</text><text x="225.012" y="74.808" font-size="2.8" text-anchor="start" fill="#101418">LEFT,and the concentric-circle end view at LEFT. Include the center axis.</text><text x="225.012" y="78.588" font-size="2.8" text-anchor="start" fill="#101418">This is a required paper diagram,not a text-only closure.</text><text x="225.012" y="85.724" font-size="2.8" text-anchor="start" fill="#101418">Q10 - First-angle symbol</text><text x="225.012" y="89.504" font-size="2.8" text-anchor="start" fill="#101418">Use the same source frustum orientation,larger end RIGHT and smaller end</text><text x="225.012" y="93.284" font-size="2.8" text-anchor="start" fill="#101418">LEFT,but put its concentric-circle end view at RIGHT for first-angle</text><text x="225.012" y="97.064" font-size="2.8" text-anchor="start" fill="#101418">arrangement. Include the center axis. This is a required paper diagram.</text><text x="225.012" y="104.749" font-size="2.8" text-anchor="start" fill="#101418">Q11 - Angle convention difference</text><text x="225.012" y="108.529" font-size="2.8" text-anchor="start" fill="#101418">First:object between viewer and plane,Top below/Right left. Third:plane</text><text x="225.012" y="112.309" font-size="2.8" text-anchor="start" fill="#101418">between viewer and object,Top above/Right right.</text><text x="225.012" y="120.27" font-size="2.8" text-anchor="start" fill="#101418">Q12 - US first angle</text><text x="225.012" y="124.05" font-size="2.8" text-anchor="start" fill="#101418">False under the book&#39;s US third-angle convention.</text><text x="225.012" y="132.286" font-size="2.8" text-anchor="start" fill="#101418">Q13 - Section hatches</text><text x="225.012" y="136.066" font-size="2.8" text-anchor="start" fill="#101418">True. Conventional patterns may indicate material families; they are not a</text><text x="225.012" y="139.846" font-size="2.8" text-anchor="start" fill="#101418">substitute for exact material specification.</text><text x="225.012" y="147.807" font-size="2.8" text-anchor="start" fill="#101418">Q14 - Mechanical dimension endings</text><text x="225.012" y="151.587" font-size="2.8" text-anchor="start" fill="#101418">True under the source mechanical-drafting convention, with architectural</text><text x="225.012" y="155.367" font-size="2.8" text-anchor="start" fill="#101418">slash/dot exceptions kept separate.</text><text x="225.012" y="163.328" font-size="2.8" text-anchor="start" fill="#101418">Q15 - Break lines example</text><text x="225.012" y="167.108" font-size="2.8" text-anchor="start" fill="#101418">True. They delimit a removed/omitted portion, e.g.a long shaft shortened to</text><text x="225.012" y="170.888" font-size="2.8" text-anchor="start" fill="#101418">fit the sheet or a local broken-out region exposing an interior feature.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">CHAPTER2 - REVIEW Q1-Q15</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">PLANCHARD2-37-PDF123</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="247.68" y1="240" x2="255.93" y2="240" fill="none" stroke="#2b3138" stroke-width="0.25" stroke-dasharray="7 1.6 1.6 1.6"/><text x="267.68" y="241.6" font-size="2" text-anchor="start" fill="#6b7280">THIRD ANGLE</text></svg>
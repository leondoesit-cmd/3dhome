 defined Top profiles; six history steps.</text><text x="235.911" y="213.521" font-size="2.8" text-anchor="start" fill="#101418">Base Boss15; left upright atY15 Boss35.</text><text x="235.911" y="217.301" font-size="2.8" text-anchor="start" fill="#101418">Reversecut15 atY15: X30..45/Z20..40.</text><text x="235.911" y="221.081" font-size="2.8" text-anchor="start" fill="#101418">Native isometric camera looks from +X/+Y/+Z.</text><text x="235.911" y="224.861" font-size="2.8" text-anchor="start" fill="#101418">Principal views support the chosen interpretation.</text><text x="135.574" y="205.9" font-size="3.5" text-anchor="middle" fill="#101418" font-weight="bold">FRONT</text><text x="135.574" y="119.5" font-size="3.5" text-anchor="middle" fill="#101418" font-weight="bold">TOP</text><text x="215.574" y="189.5" font-size="3.5" text-anchor="middle" fill="#101418" font-weight="bold">RIGHT</text><text x="359.574" y="110.815" font-size="3.5" text-anchor="middle" fill="#101418" font-weight="bold">ISOMETRIC</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280">2026-10-10</text><text x="248.68" y="262.24" font-size="5" text-anchor="start" fill="#101418" font-weight="bold">EXERCISE2.3A - UPRIGHT FORK BLOCK</text><text x="248.68" y="268.04" font-size="2
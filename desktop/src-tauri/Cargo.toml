[package]
name = "modelforge-desktop"
version = "0.1.0"
description = "ModelForge desktop shell: the unchanged web app in the OS webview (Tauri 2)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

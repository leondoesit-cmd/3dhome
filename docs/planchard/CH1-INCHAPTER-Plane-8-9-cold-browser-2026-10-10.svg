280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="40.857" y="28.922" font-size="2.8" text-anchor="start" fill="#101418">CHAPTER 1 IN-CHAPTER: PLANE 8-9</text><text x="40.857" y="32.702" font-size="2.8" text-anchor="start" fill="#101418">PDF 74 / printed 1-46</text><text x="40.857" y="36.482" font-size="2.8" text-anchor="start" fill="#101418">Inferred solutions; not a publisher answer key.</text><text x="40.857" y="40.262" font-size="2.8" text-anchor="start" fill="#101418">Plane 9 distinguishes projected area from certified visibility.</text><text x="40.857" y="63.951" font-size="2.8" text-anchor="start" fill="#101418">PLANE 8 - PDF 74 / 1-46</text><text x="40.857" y="67.731" font-size="2.8" text-anchor="start" fill="#101418">FRONT A,B; TOP D,F; RIGHT B,C,E.</text><text x="40.857" y="71.511" font-size="2.8" text-anchor="start" fill="#101418">B is a vertical diagonal base face: area in Front/Right,</text><text x="40.857" y="75.291" font-size="2.8" text-anchor="start" fill="#101418">edge-on in Top. D and F are horizontal top areas.</text><text x="40.857" y="79.071" font-size="2.8" text-anchor="start" fill="#101418"></text><text x="40.857" y="82.851" font-size="2.8" text-anchor="start" fill="#101418">PLANE 9 - PDF 74 / 1-46 - PROJECTION QUALIFICATION</text><text x="40.857" y="86.631" font-size="2.8" text-anchor="start" fill="#101418">Non-edge-on surface orientations:</text><text x="40.857" y="90.411" font-size="2.8" text-anchor="start" fill="#101418">FRONT A,B,F; TOP B,C,D,F,G; RIGHT E,H,I,J.</text><text x="40.857" y="94.191" font-size="2.8" text-anchor="start" fill="#101418">Right-side inner wall I may be occluded by outer wall H;</text><text x="40.857" y="97.971" font-size="2.8" text-anchor="start" fill="#101418">the supplied isometric does not certify I as visible there.</text><text x="40.857" y="101.751" font-size="2.8" text-anchor="start" fill="#101418">F is the quarter-round band: Front/Top area, Right edge.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280"></text><text x="248.68" y="258.2" font-size="3.2" text-anchor="start" fill="#101418" font-weight="bold">Inferred Plane 8-9 surface orientation answers, PDF 74 / 1-46; Plane 9</text><text x="248.68" y="262.4" font-size="3.2" text-anchor="start" fill="#101418" font-weight="bold">visibility qualified.</text><text x="248.68" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MATERIAL</text><text x="248.68" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="295.576" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">FINISH</text><text x="295.576" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="268.04" font-size="2" text-anchor="start" fill="#6b7280">MASS</text><text x="345.146" y="272.64" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="248.68" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DRAWN</text><text x="248.68" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="296.913" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">DWG NO.</text><text x="296.913" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">—</text><text x="345.146" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SCALE</text><text x="345.146" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1:1 · mm</text><text x="380.073" y="278.96" font-size="2" text-anchor="start" fill="#6b7280">SHEET</text><text x="380.073" y="283.56" font-size="2.5" text-anchor="start" fill="#101418" font-weight="600">1 / 1</text><text x="409" y="262.24" font-size="3.5" text-anchor="end" fill="#101418" font-weight="bold">REV A</text><circle cx="254.655" cy="240" r="2.1" fill="none" stroke="#101418" stroke-width="0.35"/><circle cx="254.655" cy="240" r="1.2" fill="none" stroke="#101418" stroke-width="0.35"/><polygon points="248.993,237.9 251.618,238.8 251.618,241.2 248.993,242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="248.993" y1="237.9" x2="248.993" y2="242.1" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="251.618" y1="238.8" x2="251.618" y2="241.2" fill="none" stroke="#101418" st
280" stroke-width="0.18"/><line x1="408" y1="148.5" x2="412" y2="148.5" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><text x="410" y="172.917" font-size="2" text-anchor="middle" fill="#6b7280">C</text><line x1="16" y1="195.333" x2="20" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="195.333" x2="412" y2="195.333" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><text x="410" y="219.75" font-size="2" text-anchor="middle" fill="#6b7280">B</text><line x1="16" y1="242.167" x2="20" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><line x1="408" y1="242.167" x2="412" y2="242.167" fill="none" stroke="#6b7280" stroke-width="0.18"/><text x="18" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="410" y="266.583" font-size="2" text-anchor="middle" fill="#6b7280">A</text><text x="239.711" y="59.824" font-size="2.8" text-anchor="start" fill="#101418">Chapter3 earlier Dimension Exercises</text><text x="239.711" y="63.604" font-size="2.8" text-anchor="start" fill="#101418">Set A Exercise2 - SOURCE ERROR DIAGRAM</text><text x="239.711" y="67.384" font-size="2.8" text-anchor="start" fill="#101418">Source PDF150 / printed3-22</text><text x="239.711" y="71.164" font-size="2.8" text-anchor="start" fill="#101418">Native paper reconstruction; source-estimated strokes</text><text x="239.711" y="74.944" font-size="2.8" text-anchor="start" fill="#101418">Illustrative placement; zero CAD</text><text x="239.711" y="84.822" font-size="2.8" text-anchor="start" fill="#101418">1. 5.50 lies inside the thin upper view despite outside space.</text><text x="239.711" y="88.602" font-size="2.8" text-anchor="start" fill="#101418">Move the overall dimension outside with proper extensions.</text><text x="239.711" y="92.382" font-size="2.8" text-anchor="start" fill="#101418">2. The lower endpoint of 1.50 floats inside the front view.</text><text x="239.711" y="96.162" font-size="2.8" text-anchor="start" fill="#101418">No feature or marked datum defines that endpoint.</text><text x="239.711" y="99.942" font-size="2.8" text-anchor="start" fill="#101418">3. Lower notch depth and overall front height are absent.</text><text x="239.711" y="103.722" font-size="2.8" text-anchor="start" fill="#101418">Do not infer them from apparent drawing proportions.</text><text x="239.711" y="107.502" font-size="2.8" text-anchor="start" fill="#101418">4. 2.00 + 1.50 + 2.00 equals 5.50: avoid a closed size chain.</text><text x="239.711" y="111.282" font-size="2.8" text-anchor="start" fill="#101418">Keep an independent set or mark the total REFERENCE.</text><text x="239.711" y="154.815" font-size="2.8" text-anchor="start" fill="#101418">Original source labels should be retained deliberately.</text><text x="239.711" y="158.595" font-size="2.8" text-anchor="start" fill="#101418">Missing sizes have no invented numeric values.</text><text x="239.711" y="162.375" font-size="2.8" text-anchor="start" fill="#101418">Recommendations refer to the supplied source diagram.</text><text x="239.711" y="166.155" font-size="2.8" text-anchor="start" fill="#101418">Native paper markup; no manufacturing CAD claimed.</text><text x="49.339" y="63.164" font-size="2.8" text-anchor="start" fill="#101418">1.00</text><text x="126.432" y="63.164" font-size="2.8" text-anchor="start" fill="#101418">5.50</text><text x="85.396" y="131.557" font-size="2.8" text-anchor="start" fill="#101418">2.00</text><text x="127.362" y="123.468" font-size="2.8" text-anchor="start" fill="#101418">1.50</text><text x="165.288" y="131.557" font-size="2.8" text-anchor="start" fill="#101418">2.00</text><text x="74.517" y="163.574" font-size="2.8" text-anchor="start" fill="#101418">.50</text><text x="175.237" y="157.975" font-size="2.8" text-anchor="start" fill="#101418">1.50</text><circle cx="134.79"
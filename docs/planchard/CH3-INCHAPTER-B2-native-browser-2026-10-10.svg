1418">Native paper reconstruction; source-estimated strokes</text><text x="239.711" y="74.944" font-size="2.8" text-anchor="start" fill="#101418">Illustrative placement; zero CAD</text><text x="239.711" y="84.822" font-size="2.8" text-anchor="start" fill="#101418">1. Ø.50 THRU sizes the hole but does not locate its centre.</text><text x="239.711" y="88.602" font-size="2.8" text-anchor="start" fill="#101418">Add two centre dimensions or explicit symmetry.</text><text x="239.711" y="92.382" font-size="2.8" text-anchor="start" fill="#101418">2. Notch depth is absent; width = 2 - .60 - .60 = .80.</text><text x="239.711" y="96.162" font-size="2.8" text-anchor="start" fill="#101418">Do not infer notch depth from drawing proportions.</text><text x="239.711" y="99.942" font-size="2.8" text-anchor="start" fill="#101418">3. Bore projection detail is absent in Front and Right.</text><text x="239.711" y="103.722" font-size="2.8" text-anchor="start" fill="#101418">Add hidden detail after the missing location is defined.</text><text x="239.711" y="107.502" font-size="2.8" text-anchor="start" fill="#101418">4. Right .60 has an incomplete dimension presentation.</text><text x="239.711" y="111.282" font-size="2.8" text-anchor="start" fill="#101418">Use complete dimension/extension lines with offset gaps.</text><text x="239.711" y="154.815" font-size="2.8" text-anchor="start" fill="#101418">Original source labels retained deliberately.</text><text x="239.711" y="158.595" font-size="2.8" text-anchor="start" fill="#101418">Missing sizes have no invented numeric values.</text><text x="239.711" y="162.375" font-size="2.8" text-anchor="start" fill="#101418">Source missing projections and malformed .60 are retained.</text><text x="239.711" y="166.155" font-size="2.8" text-anchor="start" fill="#101418">Native paper markup; no manufacturing CAD claimed.</text><line x1="55.82" y1="49.9" x2="117.86" y2="49.9" fill="none" stroke="#101418" stroke-width="0.5"/><line x1="117.86" y1="49.9" x2="117.
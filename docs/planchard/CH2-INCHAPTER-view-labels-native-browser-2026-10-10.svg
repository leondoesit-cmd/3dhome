34.73" y="69.945" font-size="2.8" text-anchor="start" fill="#101418">Left of centre: LEFT - DEPTH / HEIGHT.</text><text x="34.73" y="73.725" font-size="2.8" text-anchor="start" fill="#101418">Centre: FRONT - WIDTH / HEIGHT.</text><text x="34.73" y="77.505" font-size="2.8" text-anchor="start" fill="#101418">Right of centre: RIGHT - DEPTH / HEIGHT.</text><text x="34.73" y="81.285" font-size="2.8" text-anchor="start" fill="#101418">Below centre: BOTTOM - WIDTH / DEPTH.</text><text x="34.73" y="85.065" font-size="2.8" text-anchor="start" fill="#101418">Upper-right picture: ISOMETRIC.</text><text x="34.73" y="88.845" font-size="2.8" text-anchor="start" fill="#101418">Pairs above mean horizontal / vertical.</text><text x="34.73" y="92.625" font-size="2.8" text-anchor="start" fill="#101418">Isometric WIDTH spans the bracket flange.</text><text x="34.73" y="96.405" font-size="2.8" text-anchor="start" fill="#101418">DEPTH follows the base toward the flange.</text><text x="34.73" y="100.185" font-size="2.8" text-anchor="start" fill="#101418">HEIGHT rises along the upright flange.</text><text x="34.73" y="103.965" font-size="2.8" text-anchor="start" fill="#101418">No numerical dimensions are required.</text><text x="224.713" y="54.825" font-size="2.8" text-anchor="start" fill="#101418">EXERCISE1 - PDF113 / PAGE2-27</text><text x="224.713" y="58.605" font-size="2.8" text-anchor="start" fill="#101418">Third-angle view-name exercise.</text><text x="224.713" y="62.385" font-size="2.8" text-anchor="start" fill="#101418">Upper hatched shaft: SECTION A-A.</text><text x="224.713" y="66.165" font-size="2.8" text-anchor="start" fill="#101418">Upper-right pictorial: ISOMETRIC.</text><text x="224.713" y="69.945" font-size="2.8" text-anchor="start" fill="#101418">Far-left enlarged groove: DETAIL B.</text><text x="224.713" y="73.725" font-size="2.8" text-anchor="start" fill="#101418">Middle long shaft: FRONT / PARENT VIEW.</text><text x="224.713" y="77.505" font-size="2.8" text-anchor="start" fill="#101418">Middle-right circular end: RIGHT VIEW.</text><text x="224.713" y="81.285" font-size="2.8" text-anchor="start" fill="#101418">Lower shortened shaft: BREAK VIEW.</text><text x="224.713" y="85.065" font-size="2.8" text-anchor="start" fill="#101418">Lower-right mark: THIRD-ANGLE SYMBOL.</text><text x="224.713" y="88.845" font-size="2.8" text-anchor="start" fill="#101418">A-A arrows identify the hatched section.</text><text x="224.713" y="92.625" font-size="2.8" text-anchor="start" fill="#101418">CircleB identifies the enlarged DetailB.</text><text x="224.713" y="96.405" font-size="2.8" text-anchor="start" fill="#101418">Break boundaries omit the middle length.</text><text x="34.73" y="169.814" font-size="2.8" text-anchor="start" fill="#101418">Positional answers refer to the supplied book figures.</text><text x="34.73" y="173.594" font-size="2.8" text-anchor="start" fill="#101418">This worksheet does not recreate or dimension their solids.</text><rect x="245.68" y="247" width="166.32" height="42" fill="#ffffff" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="264.64" x2="412" y2="264.64" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="245.68" y1="275.56" x2="412" y2="275.56" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="342.146" y1="264.64" x2="342.146" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="293.913" y1="275.56" x2="293.913" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><line x1="377.073" y1="275.56" x2="377.073" y2="289" fill="none" stroke="#101418" stroke-width="0.35"/><text x="248.68" y="253.4" font-size="2.5" text-anchor="start" fill="#334155" font-weight="600"></text><text x="409" y="253.4" font-size="2" text-anchor="end" fill="#6b7280"></text><text x="248.68" y="258.2" font-size="3.2" text-anchor="start" fill="#101418" font-weight="bold">Source-positional view and extent answers, Planchard2021 PDF106 / 2-20 and /</text><text x="248.68" y="262.4" font-size="3.2" text-a